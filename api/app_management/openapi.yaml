openapi: 3.0.3

info:
  title: CasaOS App Management API
  version: v2
  description: |
    CasaOS App Management manages app lifecycle, including installing, uninstalling, starting, stopping, setting, etc.

    For issues, please visit the [GitHub repository](https://github.com/ReCasaOS/CasaOS-AppManagement).

servers:
  - url: /v2/app_management

tags:
  - name: Common methods
    description: |-
      methods for common usage

  - name: AppStore methods
    description: |-
      methods for accessing local app store

  - name: Compose methods
    description: |-
      methods for managing compose app lifecycle

  - name: Container methods
    description: |-
      methods for managing container app lifecycle

  - name: Image methods
    description: |-
      methods for managing container app images

  - name: Git methods
    description: |-
      methods for apps deployed from their git repository

  - name: Stats methods
    description: |-
      resource history of every container, sampled every five seconds and kept seven days

  - name: Logs methods
    description: |-
      every app container's lines and events, kept on /DATA, live and searchable

  - name: Internal methods
    description: |-
      methods for internal use ONLY

  - name: AppStoreInfo
    description: |-
      <SchemaDefinition schemaRef="#/components/schemas/AppStoreInfo" />

  - name: ComposeApp
    description: |-
      <SchemaDefinition schemaRef="#/components/schemas/ComposeApp" />

  - name: ComposeAppStoreInfoLists
    description: |-
      <SchemaDefinition schemaRef="#/components/schemas/ComposeAppStoreInfoLists" />

  - name: ComposeAppStoreInfo
    description: |-
      <SchemaDefinition schemaRef="#/components/schemas/ComposeAppStoreInfo" />

  - name: ContainerSummary
    description: |-
      <SchemaDefinition schemaRef="#/components/schemas/ContainerSummary" />

  - name: ContainerStoreInfo
    description: |-
      <SchemaDefinition schemaRef="#/components/schemas/ContainerStoreInfo" />

  - name: EnvStoreInfo
    description: |-
      <SchemaDefinition schemaRef="#/components/schemas/EnvStoreInfo" />

  - name: PortStoreInfo
    description: |-
      <SchemaDefinition schemaRef="#/components/schemas/PortStoreInfo" />

  - name: VolumeStoreInfo
    description: |-
      <SchemaDefinition schemaRef="#/components/schemas/VolumeStoreInfo" />

  - name: DeviceStoreInfo
    description: |-
      <SchemaDefinition schemaRef="#/components/schemas/DeviceStoreInfo" />

  - name: ComposeAppValidationErrors
    description: |-
      <SchemaDefinition schemaRef="#/components/schemas/ComposeAppValidationErrors" />

  - name: ComposeAppValidationErrorsPortsInUse
    description: |-
      <SchemaDefinition schemaRef="#/components/schemas/ComposeAppValidationErrorsPortsInUse" />

  - name: ComposeAppValidationErrorsPortsOutOfRange
    description: |-
      <SchemaDefinition schemaRef="#/components/schemas/ComposeAppValidationErrorsPortsOutOfRange" />

x-tagGroups:
  - name: Methods
    tags:
      - Common methods
      - AppStore methods
      - Compose methods
      - Container methods
      - Image methods
      - Git methods
      - Stats methods
      - Logs methods

  - name: Schemas
    tags:
      - AppStoreInfo
      - ComposeApp
      - ComposeAppStoreInfoLists
      - ComposeAppStoreInfo
      - ContainerSummary
      - EnvStoreInfo
      - PortStoreInfo
      - VolumeStoreInfo
      - DeviceStoreInfo

  - name: Errors
    tags:
      - ComposeAppValidationErrorsPortsInUse
      - ComposeAppValidationErrorsPortsOutOfRange
      - ComposeAppValidationErrors

security:
  - access_token: []

paths:
  /info:
    get:
      summary: Get certain common information
      operationId: info
      tags:
        - Common methods
      responses:
        "200":
          $ref: "#/components/responses/InfoOK"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /operations:
    get:
      summary: The operations running on apps right now
      description: |
        What holds an app (a restore, an install, an update, a git app's check, build or
        deployment, a settings change, a backup that stops the app), and every backup and
        restore in progress whether or not it holds its app: a backup copied from the running
        app, as asked or because the app answers DNS, the retention that deletes old runs
        after a backup, and the box's own backup and restore, listed as `casaos-system`.
        One entry per app, sorted by app. An empty list means nothing runs: the core asks
        before it updates the box by itself, and waits while anything is listed.
      operationId: appOperations
      tags:
        - Common methods
      responses:
        "200":
          $ref: "#/components/responses/AppOperationsOK"

  /convert:
    post:
      summary: Convert to compose app from another file format
      operationId: convert
      tags:
        - Common methods
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum:
              - appfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          $ref: "#/components/responses/ComposeAppOK"
        "400":
          $ref: "#/components/responses/ResponseBadRequest"

  /global:
    get:
      summary: Get all global settings
      operationId: getGlobalSettings
      tags:
        - Common methods
      responses:
        "200":
          $ref: "#/components/responses/GlobalSettingsOK"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /global/{key}:
    put:
      summary: Update a global setting
      operationId: updateGlobalSetting
      tags:
        - Common methods
      parameters:
        - $ref: "#/components/parameters/GlobalSettingKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GlobalSetting"
      responses:
        "200":
          $ref: "#/components/responses/GlobalSettingOK"
        "400":
          $ref: "#/components/responses/ResponseBadRequest"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

    delete:
      summary: Delete a global setting
      operationId: deleteGlobalSetting
      tags:
        - Common methods
      parameters:
        - $ref: "#/components/parameters/GlobalSettingKey"
      responses:
        "200":
          $ref: "#/components/responses/ResponseOK"
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

    get:
      summary: Get a global setting
      operationId: getGlobalSetting
      tags:
        - Common methods
      parameters:
        - $ref: "#/components/parameters/GlobalSettingKey"
      responses:
        "200":
          $ref: "#/components/responses/GlobalSettingOK"
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"
     
  /appstore:
    get:
      summary: Get the list of registered app stores
      description: |
        (TODO)
      operationId: appStoreList
      tags:
        - AppStore methods
      responses:
        "200":
          $ref: "#/components/responses/AppStoreListOK"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

    post:
      summary: Register an app store
      description: |
        (TODO)
      operationId: registerAppStore
      tags:
        - AppStore methods
      parameters:
        - $ref: "#/components/parameters/AppStoreURL"
      responses:
        "200":
          $ref: "#/components/responses/AppStoreRegisterOK"
        "400":
          $ref: "#/components/responses/ResponseBadRequest"
        "409":
          $ref: "#/components/responses/ResponseConflict"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /appstore/{id}:
    delete:
      summary: Unregister an app store
      description: |
        (TODO)
      operationId: unregisterAppStore
      tags:
        - AppStore methods
      parameters:
        - $ref: "#/components/parameters/AppStoreID"
      responses:
        "200":
          $ref: "#/components/responses/AppStoreUnregisterOK"
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /categories:
    get:
      summary: Get the list of app categories
      description: |
        (TODO)
      operationId: CategoryList
      tags:
        - AppStore methods
      responses:
        "200":
          $ref: "#/components/responses/CategoryListOK"

  /apps:
    get:
      summary: Get app list from registered app stores
      description: |
        Get lists of StoreInfo of all compose apps from AppStore.
      operationId: composeAppStoreInfoList
      tags:
        - AppStore methods
      parameters:
        - $ref: "#/components/parameters/StoreAppCategoryFilter"
        - $ref: "#/components/parameters/StoreAppAuthorTypeFilter"
        - $ref: "#/components/parameters/StoreAppRecommendedFilter"
      responses:
        "200":
          $ref: "#/components/responses/ComposeAppStoreInfoListsOK"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"
  
  /compose/updates:
    get:
      summary: What updating every app at once would do
      description: |
        The apps with an update on offer, and for each the images an update would
        write: the catalogue's image where the catalogue moved one (`catalogue`),
        or every image as it is where the last image check found a newer build
        under a tag the app already names (`image`). Nothing is changed by asking.

        With `check=true` the same sweep as `POST /image-updates` runs first, one
        round trip per distinct image, so the plan is as fresh as the registries;
        a registry that does not answer is not fatal.
      operationId: composeAppUpdatePlan
      tags:
        - Compose methods
      parameters:
        - name: check
          in: query
          description: Ask every image's registry first.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          $ref: "#/components/responses/ComposeAppUpdatePlanOK"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"
    post:
      summary: Update the apps listed, one after another
      description: |
        The same update the button on each app runs, for every app listed, in the
        order given, one at a time, on this box rather than from the browser: a tab
        closed halfway does not stop it. Each app publishes the events an update
        publishes. The run is answered as it starts; `GET /compose/updates/run`
        says what became of each app.

        One run at a time: a second list while one is going is refused with 409.
      operationId: updateComposeApps
      tags:
        - Compose methods
      requestBody:
        $ref: "#/components/requestBodies/RequestComposeAppUpdates"
      responses:
        "202":
          $ref: "#/components/responses/ComposeAppUpdateRunOK"
        "400":
          $ref: "#/components/responses/ResponseBadRequest"
        "409":
          $ref: "#/components/responses/ResponseConflict"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /compose/updates/run:
    get:
      summary: The update of every app in progress, or the last one
      description: |
        Each app of the run and what became of it: queued, updating, updated,
        current (nothing to do, with the reason when there is one), or failed with
        the error. `finished_at` is set once the last app is done. Kept in memory:
        a restart of this service forgets the last run.
      operationId: composeAppUpdateRun
      tags:
        - Compose methods
      responses:
        "200":
          $ref: "#/components/responses/ComposeAppUpdateRunOK"
        "404":
          $ref: "#/components/responses/ResponseNotFound"

  /image-updates:
    post:
      summary: Check every installed app for a newer image
      description: |
        Asks each image's registry for the digest its tag points at now and compares it
        with the digest of the copy on disk. This sees apps that came from no app store,
        which the store's own upgradable list cannot.

        One network round trip per distinct image, so this is a deliberate action rather
        than something the app grid does on every load. The result is cached and served
        as `update_available` on each grid item until the next call.

        An image no answer can be obtained for -- an unreachable registry, credentials
        this host does not have, an image never pulled -- is listed in `unchecked`
        instead of being guessed at, and its app keeps the answer it had.
      operationId: checkImageUpdates
      tags:
        - App methods
      responses:
        "200":
          $ref: "#/components/responses/ImageUpdateCheckOK"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /apps/upgradable:
    get:
      summary: Get the list of upgradable apps from installed app.
      description: |
        (TODO)
      operationId: upgradableAppList
      tags:
        - AppStore methods
      responses:
        "200":
          $ref: "#/components/responses/UpgradableAppListOK"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"


  /apps/{id}:
    get:
      summary: Get app info from registered app stores
      description: |
        Get StoreInfo of specific compose app.

        > A compose app contains one or more container `apps`. One of the `apps` is the `main` of this compose app, whereas others are dependency `apps`.
      operationId: composeAppStoreInfo
      tags:
        - AppStore methods
      parameters:
        - $ref: "#/components/parameters/StoreAppIDString"
      responses:
        "200":
          $ref: "#/components/responses/ComposeAppStoreInfoOK"
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /apps/{id}/stable:
    get:
      summary: Get app stable version from registered app stores
      description: |
        Get stable version(Official Store Tag) of main service of specific compose app.
      operationId: composeAppMainStableTag
      tags:
        - AppStore methods
      parameters:
        - $ref: "#/components/parameters/StoreAppIDString"
      responses:
        "200":
          $ref: "#/components/responses/ComposeAppStoreTagOK"
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /apps/{id}/stable/{serviceName}:
    get:
      summary: Get server of app stable version from registered app stores
      description: |
        Get stable version(Official Store Tag) of main service of specific compose app.
      operationId: composeAppServiceStableTag
      tags:
        - AppStore methods
      parameters:
        - $ref: "#/components/parameters/StoreAppIDString"
        - name: serviceName
          in: path
          description: Service name of the compose app
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/ComposeAppStoreTagOK"
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"


  /apps/{id}/compose:
    get:
      summary: Get compose details of an app from registered app stores
      description: |
        Accept both `application/json` and `application/yaml` content type for the `Accept` header in the HTTP request.

        If the `Accept` header is set to `application/yaml`, the response will be the original `docker-compose.yml` content that follows [Compose Specification](https://compose-spec.io).
      operationId: composeApp
      tags:
        - AppStore methods
      parameters:
        - $ref: "#/components/parameters/StoreAppIDString"
      responses:
        "200":
          $ref: "#/components/responses/ComposeAppOK"
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /compose:
    get:
      summary: Get the list of installed compose apps
      description: |
        Returns the installed compose apps in the runtime view, with `.env` values resolved (the dashboard needs the published ports to build links). The editing view of an app is `GET /compose/{id}` with `Accept: application/yaml`.
      operationId: myComposeAppList
      tags:
        - Compose methods
      responses:
        "200":
          $ref: "#/components/responses/ComposeAppListOK"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

    post:
      summary: Install a compose app
      description: |
        Install a compose app from the Docker Compose YAML content provided in the request.

        > - The request has to be `content-type: application/yaml` and the body has to follow [Compose Specification](https://compose-spec.io).
        > - When `dry_run=true` is provided in the query string, it only validates the YAML content.
        > - A top-level `x-casaos-env` string is the app's `.env`, installed with it: it is taken out of the compose text, the compose is checked with its values (an `env_file: .env` included), and it is written as the `.env` next to the app's `docker-compose.yml`. A reference to one of its keys stays as written in the compose file, as for a `.env` added later (`PUT /compose/{id}/env`). A key CasaOS sets itself (`TZ`, `PUID`, `PGID`, `AppID`...) is refused with a `400`.

      operationId: installComposeApp
      tags:
        - Compose methods
      parameters:
        - $ref: "#/components/parameters/DryRun"
        - $ref: "#/components/parameters/CheckPortConflict"
        # TODO remove the unused parameters later. 
        # the params is deprecated. because frontend is hard to know is the app is stable or not.
        - $ref: "#/components/parameters/Uncontrolled"
      requestBody:
        $ref: "#/components/requestBodies/RequestComposeApp"
      responses:
        "200":
          $ref: "#/components/responses/ComposeAppInstallOK"
        "400":
          $ref: "#/components/responses/ComposeAppBadRequest"
        "409":
          $ref: "#/components/responses/ResponseConflict"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /compose/{id}:
    get:
      summary: Get compose details of a locally installed app
      description: |
        Accept both `application/json` and `application/yaml` content type for the `Accept` header in the HTTP request.

        If the `Accept` header is set to `application/yaml`, the response will be the interpolated `docker-compose.yml` content that follows [Compose Specification](https://compose-spec.io): the editing view, what `PUT /compose/{id}` takes back.

        With `application/json` the response is the runtime view, with `.env` values resolved (the dashboard needs the published ports to build links); it is for debugging, not for saving back.

        > - The difference between this and `/apps/{id}/compose` is that the compose detail returned has all environment variables interpolated. E.g. `$TZ` will be replaced by actual timezone text in the JSON view.
        > - In the YAML view, a reference to a key of the app's `.env` (`${KEY}`, `$KEY`, `${KEY:-default}`) or to a key the runtime defines (`$AppID`, `${TZ}`, `$PUID`...) is returned as written, not resolved, in every free-text field (`environment`, `env_file`, `image`, `command`, `labels`, `x-casaos`...) and in the host side of `ports` and `volumes` (which come back in the long syntax). It cannot be kept in a typed field, a number, a boolean, a size or a duration (`cpus`, `cpu_count`, `mem_limit`, `shm_size`, `privileged`, `stop_grace_period`, `deploy.resources`...): the request fails with `500` naming the field, and that field has to be edited in the file on disk.
        > - Paths (`volumes`, `env_file`, `build`...) are returned as written in the file, relative to the app directory when they are; docker compose resolves them when the app is (re)created. `env_file` is not merged into `environment`.
      operationId: myComposeApp
      tags:
        - Compose methods
      parameters:
        - $ref: "#/components/parameters/ComposeAppID"
      responses:
        "200":
          $ref: "#/components/responses/ComposeAppOK"
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

    put:
      summary: Apply settings to a compose app
      description: |
        Apply settings to a compose app from the Docker Compose YAML content provided in the request.

        > - The request has to be `content-type: application/yaml` and the body has to follow [Compose Specification](https://compose-spec.io).
        > - A reference to a key of the app's `.env` is copied as written (see `GET /compose/{id}` for the fields where it is kept). The keys are those of the `.env` on disk at that moment: a key has to be in `.env` (`PUT /compose/{id}/env`) before a compose referencing it is saved, otherwise the reference is baked as a literal.
        > - When `dry_run=true` is provided in the query string, it only validates the YAML content.

      operationId: applyComposeAppSettings
      tags:
        - Compose methods
      parameters:
        - $ref: "#/components/parameters/ComposeAppID"
        - $ref: "#/components/parameters/DryRun"
        - $ref: "#/components/parameters/CheckPortConflict"
        - $ref: "#/components/parameters/Uncontrolled"
      requestBody:
        $ref: "#/components/requestBodies/RequestComposeApp"
      responses:
        "200":
          $ref: "#/components/responses/ComposeAppUpdateSettingsOK"
        "400":
          $ref: "#/components/responses/ComposeAppBadRequest"
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "409":
          $ref: "#/components/responses/ResponseConflict"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

    patch:
      summary: Update container images of compose app to match the compose app in AppStore.
      description: |
        Update a ComposeApp to the latest version of the app in the AppStore.
      operationId: updateComposeApp
      tags:
        - Compose methods
      parameters:
        - $ref: "#/components/parameters/ComposeAppID"
        - $ref: "#/components/parameters/Force"
      responses:
        "200":
          $ref: "#/components/responses/ComposeAppUpdateOK"
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "409":
          $ref: "#/components/responses/ResponseConflict"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"
    delete:
      summary: Uninstall a compose app
      description: |
        TODO - add description
      operationId: uninstallComposeApp
      tags:
        - Compose methods
      parameters:
        - $ref: "#/components/parameters/ComposeAppID"
        - $ref: "#/components/parameters/DeleteConfigFolder"
      responses:
        "200":
          $ref: "#/components/responses/ComposeAppUninstallOK"
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "409":
          $ref: "#/components/responses/ResponseConflict"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /compose/{id}/env:
    get:
      summary: Get the `.env` file of a locally installed compose app
      description: |
        Returns the raw text of the `.env` file next to the `docker-compose.yml` of the app, or an empty body when there is none.

        Keys defined there are referenced as `${KEY}` from the compose YAML and resolved by docker compose when the app is (re)created.

        > A reference survives the settings round trip (`GET`/`PUT /compose/{id}`) in every free-text field and in the host side of `ports` and `volumes`, not in a typed field (a number, a boolean, a size, a duration); see `GET /compose/{id}`.
      operationId: composeAppEnv
      tags:
        - Compose methods
      parameters:
        - $ref: "#/components/parameters/ComposeAppID"
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

    put:
      summary: Replace the `.env` file of a compose app and re-create it
      description: |
        Writes the request body as the `.env` file of the app, then re-creates the app so the new values are picked up.

        > - The request has to be `content-type: text/plain` and the body is the whole file, one `KEY=VALUE` per line as docker compose reads it.
        > - An empty (or missing) body removes the file.
        > - A key the runtime defines itself (`AppID`, `TZ`, `PUID`, `PGID`, `DefaultUserName`, `DefaultPassword`, the environment of the CasaOS process) wins over `.env` and is refused with `400`.
        > - A reference to a key of the file is kept by the settings round trip (`GET`/`PUT /compose/{id}`) in every free-text field and in the host side of `ports` and `volumes`; a typed field, a number, a boolean, a size or a duration (`cpus`, `mem_limit`, `privileged`, `stop_grace_period`...), cannot reference `.env` from the settings editor.
        > - When `dry_run=true` is provided in the query string, the body is only validated.
      operationId: applyComposeAppEnv
      tags:
        - Compose methods
      parameters:
        - $ref: "#/components/parameters/ComposeAppID"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        description: Content of the `.env` file; empty or absent to remove it
        required: false
        content:
          text/plain:
            schema:
              type: string
      responses:
        "200":
          $ref: "#/components/responses/ComposeAppUpdateSettingsOK"
        "400":
          $ref: "#/components/responses/ResponseBadRequest"
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "409":
          $ref: "#/components/responses/ResponseConflict"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /compose/{id}/status:
    put:
      summary: Start/restart/stop a compose app
      description: |
        TODO - add description
      operationId: setComposeAppStatus
      tags:
        - Compose methods
      parameters:
        - $ref: "#/components/parameters/ComposeAppID"
      requestBody:
        $ref: "#/components/requestBodies/RequestComposeAppStatus"
      responses:
        "200":
          $ref: "#/components/responses/RequestComposeAppStatusOK"
        "400":
          $ref: "#/components/responses/ResponseBadRequest"
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /compose/{id}/containers:
    get:
      summary: Get the list of containers of a compose app
      description: |
        TODO - add description
      operationId: composeAppContainers
      tags:
        - Compose methods
      parameters:
        - $ref: "#/components/parameters/ComposeAppID"
      responses:
        "200":
          $ref: "#/components/responses/ComposeAppContainersOK"
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /backup/schedules:
    get:
      summary: The standing arrangements
      operationId: backupSchedules
      tags:
        - Backup methods
      responses:
        "200":
          $ref: "#/components/responses/BackupSchedulesOK"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

    put:
      summary: Replace the standing arrangements
      description: |
        The whole list at once, which is how the screen that edits it works. A
        schedule with `keep` at zero keeps every run: deleting backups is not
        something to do because a field was left empty.
      operationId: setBackupSchedules
      tags:
        - Backup methods
      requestBody:
        $ref: "#/components/requestBodies/RequestBackupSchedules"
      responses:
        "200":
          $ref: "#/components/responses/ResponseOK"
        "400":
          $ref: "#/components/responses/ResponseBadRequest"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /backup/schedules/run:
    post:
      summary: Run standing arrangements now
      description: |
        Starts the enabled schedules now, as they would run on their own, with their
        own settings and retention. The optional body narrows them to one app, one
        destination or one pair; with no body every enabled schedule is selected.
        A forced run never counts as the schedule's own run: `last_run` does not move.
        It answers as soon as the runs have started. A pair is refused, with the
        reason, when its app has an operation in progress, when it is already
        running, or when its schedule cannot be run.
        202 when at least one pair starts, 409 when none does (an operating system
        upgrade is open, or every pair was refused), 404 when no schedule matches.
      operationId: forceBackupSchedules
      tags:
        - Backup methods
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                app:
                  type: string
                destination:
                  type: string
      responses:
        "202":
          $ref: "#/components/responses/BackupForceOK"
        "400":
          $ref: "#/components/responses/ResponseBadRequest"
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "409":
          description: Nothing could start
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/BackupForceResult"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /backup/runs:
    get:
      summary: What happened, the last few hundred times a backup ran
      description: |
        Newest first, failures included. A record that only kept its successes
        would let a box go months backing nothing up while this screen said
        everything was fine.
      operationId: backupRuns
      tags:
        - Backup methods
      responses:
        "200":
          $ref: "#/components/responses/BackupRunsOK"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /backup/verification-schedule:
    get:
      summary: When backups are read back on their own
      description: Off by default.
      operationId: backupVerificationSchedule
      tags:
        - Backup methods
      responses:
        "200":
          $ref: "#/components/responses/BackupVerificationScheduleOK"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

    put:
      summary: Replace when backups are read back on their own
      description: '`last_run` is ignored.'
      operationId: setBackupVerificationSchedule
      tags:
        - Backup methods
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupVerificationSchedule"
      responses:
        "200":
          $ref: "#/components/responses/ResponseOK"
        "400":
          $ref: "#/components/responses/ResponseBadRequest"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /backup/signin:
    post:
      summary: Start signing in to a cloud drive from the interface
      description: |
        A box has no browser, so this runs `rclone authorize` on it and returns the
        provider's sign-in address, to be opened in the browser of whoever is using
        the interface. Once they have signed in the provider redirects to
        `http://127.0.0.1:53682/`, which does not load on their computer; the
        address of that page is then sent to `/backup/signin/finish`.

        Only one sign-in waits at a time: starting another replaces it. It expires
        after ten minutes.
      operationId: backupSignIn
      tags:
        - Backup methods
      requestBody:
        $ref: "#/components/requestBodies/RequestBackupSignIn"
      responses:
        "200":
          $ref: "#/components/responses/BackupSignInOK"
        "400":
          $ref: "#/components/responses/ResponseBadRequest"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /backup/signin/finish:
    post:
      summary: Finish signing in to a cloud drive
      description: |
        Takes the address of the page the provider redirected to after sign-in -- the
        one that failed to load -- and returns the token rclone obtained with it. The
        token goes in the `token` option of the destination, as it would if it had
        come from `rclone authorize`.
      operationId: backupSignInFinish
      tags:
        - Backup methods
      requestBody:
        $ref: "#/components/requestBodies/RequestBackupSignInFinish"
      responses:
        "200":
          $ref: "#/components/responses/BackupSignInFinishOK"
        "400":
          $ref: "#/components/responses/ResponseBadRequest"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /backup/verifications:
    get:
      summary: List backup data verification results
      description: |
        A separate history, newest first, including the currently running check.
        Passed means the available backup was downloaded and compared with its
        current remote contents. It does not prove historical integrity or that
        an application can start. Interrupted checks never become passed.
      operationId: backupVerifications
      tags:
        - Backup methods
      responses:
        "200":
          $ref: "#/components/responses/BackupVerificationsOK"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"
    post:
      summary: Download and compare a backup in private temporary storage
      description: |
        Starts one asynchronous data verification, limited to 1 GiB, 100,000 files
        and one hour; a bigger backup ends as not_verifiable. A destination kept
        with restic is refused (400): use its repository check instead.
        No app is started or stopped and no existing app data is replaced.
        Only one verification runs at a time. Temporary data is removed only
        after transfers are confirmed stopped. Existing backups have no original
        file hashes, so this checks the copy available now, not its original state.
      operationId: startBackupVerification
      tags:
        - Backup methods
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupVerificationRequest"
      responses:
        "202":
          $ref: "#/components/responses/BackupVerificationOK"
        "400":
          $ref: "#/components/responses/ResponseBadRequest"
        "409":
          description: A verification is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /backup/running:
    get:
      summary: The backups that run now, and the scheduler's pass
      description: |
        Every backup running on this box, with how far its engine says the operation under
        way has got, and the last pass of the scheduler and the last forced chain with what
        each did, does and will do. Empty lists when nothing runs and nothing ran since the
        service started. A field that is not known is left out.
      operationId: backupRunning
      tags:
        - Backup methods
      responses:
        "200":
          $ref: "#/components/responses/BackupRunningOK"

  /backup/running/{backup_id}/stop:
    post:
      summary: Stop one backup that runs
      description: |
        Stops that backup alone; a pass goes on with the next app. What was copied stays at
        the destination, and the run is recorded as stopped from the interface.
      operationId: stopRunningBackup
      tags:
        - Backup methods
      parameters:
        - in: path
          name: backup_id
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "202":
          description: The stop was asked for
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "404":
          $ref: "#/components/responses/ResponseNotFound"

  /backup/verifications/{verification_id}/cancel:
    post:
      summary: Request cancellation of a running data verification
      description: The result remains running until its transfers have stopped.
      operationId: cancelBackupVerification
      tags:
        - Backup methods
      parameters:
        - in: path
          name: verification_id
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "202":
          $ref: "#/components/responses/BackupVerificationOK"
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "409":
          description: The verification is no longer running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /backup/destinations:
    get:
      summary: List the backup destinations this box knows
      description: |
        Names only. A destination's credentials live in rclone's own config and are
        never read back out through here.
      operationId: backupDestinations
      tags:
        - Backup methods
      responses:
        "200":
          $ref: "#/components/responses/BackupDestinationsOK"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /backup/destinations/{name}:
    put:
      summary: Add or replace a backup destination
      description: |
        `backend` is an rclone backend name -- s3, sftp, ftp -- and `parameters` are
        that backend's own options, passed through untouched. rclone validates them
        and knows what each backend needs.

        Credentials are stored by rclone, in the same config as the cloud drives
        this box already mounts.
      operationId: setBackupDestination
      tags:
        - Backup methods
      parameters:
        - $ref: "#/components/parameters/BackupDestinationName"
      requestBody:
        $ref: "#/components/requestBodies/RequestBackupDestination"
      responses:
        "200":
          $ref: "#/components/responses/ResponseOK"
        "400":
          $ref: "#/components/responses/ResponseBadRequest"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

    delete:
      summary: Forget a backup destination
      description: |
        Removes the way in, not the backups. Whatever was already copied there stays
        where it is.
      operationId: deleteBackupDestination
      tags:
        - Backup methods
      parameters:
        - $ref: "#/components/parameters/BackupDestinationName"
      responses:
        "200":
          $ref: "#/components/responses/ResponseOK"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /backup/destinations/{name}/check:
    post:
      summary: Ask a destination whether it is reachable
      description: |
        Worth doing when somebody configures a destination rather than at 3am by a
        scheduled job nobody is watching: a typo in a bucket name found then is a
        backup that never existed.

        The space figures are absent for the many backends that have no answer to
        "how much room is left".
      operationId: checkBackupDestination
      tags:
        - Backup methods
      parameters:
        - $ref: "#/components/parameters/BackupDestinationName"
      responses:
        "200":
          $ref: "#/components/responses/BackupDestinationCheckOK"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /backup/destinations/{name}/restic:
    get:
      summary: Whether a destination keeps its backups with restic
      description: |
        `available` is whether the restic program is on this box; `enabled` is
        whether the backups to come go into restic. `kept` is whether this box holds
        the key of a repository there, which is the case while `enabled` and also
        after the destination was switched back: what the repository holds stays
        listed and restorable. `last_check` is how the last check of its
        repository went, once there has been one.
      operationId: backupDestinationRestic
      tags:
        - Backup methods
      parameters:
        - $ref: "#/components/parameters/BackupDestinationName"
      responses:
        "200":
          $ref: "#/components/responses/BackupDestinationResticOK"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

    put:
      summary: Keep a destination's backups with restic
      description: |
        From now on a backup to this destination goes into a restic repository there,
        in the folder `casaos-restic`: a run costs what changed since the last one,
        and the files keep their owners and permissions. Backups already on the
        destination stay where they are and can still be restored; they are listed
        together with the ones in the repository, and the retention of a schedule
        counts them all.

        Without a `password` a new repository is made with a new password, which is
        returned here, and read back later from `GET .../restic/password`: a
        repository whose password is lost cannot be read by anyone. With one, the destination is attached to the
        repository already there -- how backups are reached again on another box.

        A destination that was switched back (`DELETE`) still has its key on this
        box: sent without a `password`, this takes the repository up again after
        checking that it still opens, and the `password` it answers is empty. A
        `password` sent for such a destination is refused.

        The password is kept on this box in a file only root can read. The box's own
        backup does not hold it: it may itself be kept in the repository the key
        opens, and a key that lies inside what it opens opens nothing on a new box.
      operationId: enableBackupDestinationRestic
      tags:
        - Backup methods
      parameters:
        - $ref: "#/components/parameters/BackupDestinationName"
      requestBody:
        $ref: "#/components/requestBodies/RequestBackupDestinationRestic"
      responses:
        "200":
          $ref: "#/components/responses/BackupDestinationResticPasswordOK"
        "400":
          $ref: "#/components/responses/ResponseBadRequest"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

    delete:
      summary: Go back to rclone for a destination's next backups
      description: |
        The backups to come are made as stamped copies again. Nothing is deleted: the
        repository stays on the destination, its key stays on this box, and what it
        holds stays listed and restorable, so this can be undone with `PUT`.

        A destination that does not keep a restic repository is refused.
      operationId: disableBackupDestinationRestic
      tags:
        - Backup methods
      parameters:
        - $ref: "#/components/parameters/BackupDestinationName"
      responses:
        "200":
          $ref: "#/components/responses/ResponseOK"
        "400":
          $ref: "#/components/responses/ResponseBadRequest"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /backup/destinations/{name}/restic/password:
    get:
      summary: The password of a destination's restic repository
      description: |
        The key this box keeps for the repository at this destination, so that its
        owner can keep a copy elsewhere: the box's own backup does not hold it, and a
        box that is lost takes it along. Answered while the box keeps the key, also
        after the destination was switched back to rclone.

        A destination whose key this box does not keep is refused.
      operationId: backupDestinationResticPassword
      tags:
        - Backup methods
      parameters:
        - $ref: "#/components/parameters/BackupDestinationName"
      responses:
        "200":
          $ref: "#/components/responses/BackupDestinationResticPasswordOK"
        "400":
          $ref: "#/components/responses/ResponseBadRequest"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /backup/destinations/{name}/restic/check:
    post:
      summary: Check the restic repository of a destination now
      description: |
        Asks restic whether the repository is sound: its index and snapshots read, and
        every pack file the index names there with the size it should have. It does
        not read the data inside the packs. The same check runs by itself once a week
        and the answer is `last_check` of the destination's restic state; a fault is
        also told on the message bus as `backup:check-error`.

        Returns as soon as the check has started. A repository is read whole by a
        check, so only one runs at a time: a second asked for meanwhile is refused.
      operationId: checkBackupDestinationRestic
      tags:
        - Backup methods
      parameters:
        - $ref: "#/components/parameters/BackupDestinationName"
      responses:
        "200":
          $ref: "#/components/responses/ResponseOK"
        "400":
          $ref: "#/components/responses/ResponseBadRequest"
        "409":
          $ref: "#/components/responses/ResponseConflict"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /backup/destinations/{name}/runs/{app}/{stamp}:
    delete:
      summary: Delete one backup at a destination
      description: |
        Removes that run's folder from the destination. The run log keeps its
        record -- that a backup was taken and later deleted is history worth
        keeping -- and the destination no longer lists it.
      operationId: deleteBackupRun
      tags:
        - Backup methods
      parameters:
        - $ref: "#/components/parameters/BackupDestinationName"
        - $ref: "#/components/parameters/BackupApp"
        - $ref: "#/components/parameters/BackupStamp"
      responses:
        "200":
          $ref: "#/components/responses/ResponseOK"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /backup/destinations/{name}/runs/{app}/{stamp}/files:
    get:
      summary: Look inside one backup
      description: |
        One level of what a backup holds, to choose files or folders to put back.
        The top is the folders that lead to the backup's copies -- the volumes and
        folders of the app; below that, what each copy holds. Folders come first,
        then files by name. The compose file and `.env` are the definition of the
        app, not data, and are not listed.

        A path is relative to the backup and uses forward slashes. One that tries to
        leave the backup (`..`) is refused. The listing is read from the repository
        or from the stamped copy, whichever holds that backup.
      operationId: browseBackup
      tags:
        - Backup methods
      parameters:
        - $ref: "#/components/parameters/BackupDestinationName"
        - $ref: "#/components/parameters/BackupApp"
        - $ref: "#/components/parameters/BackupStamp"
        - name: path
          description: The folder to list, relative to the backup. Empty is the top.
          in: query
          required: false
          schema:
            type: string
            example: "volumes/data/docs"
      responses:
        "200":
          $ref: "#/components/responses/BackupFilesOK"
        "400":
          $ref: "#/components/responses/ResponseBadRequest"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /backup/destinations/{name}/runs:
    get:
      summary: What a destination holds
      description: |
        The apps a destination holds backups of, and their runs, newest first --
        for somebody restoring to a box whose own run log is empty. Each app says
        whether this box runs it now; a restore of one that it does not installs
        it first, from the backup's own compose file.

        Two folder listings per app and no manifest reads: a destination holding a
        year of nightly runs would take a year of round trips to describe, and the
        restore reads the one manifest it needs.
      operationId: backupDestinationRuns
      tags:
        - Backup methods
      parameters:
        - $ref: "#/components/parameters/BackupDestinationName"
      responses:
        "200":
          $ref: "#/components/responses/BackupDestinationRunsOK"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /compose/{id}/backup:
    post:
      summary: Back this app up to a destination
      description: |
        Returns as soon as the copy has started. A backup takes as long as it takes,
        and its progress arrives on the message bus.

        `hold_still` stops the app's containers for the length of the copy. Copying a
        database while it is writing produces a backup that looks fine and does not
        restore, so this defaults to stopping -- a real outage, chosen deliberately,
        which the manifest records either way.
      operationId: backupComposeApp
      tags:
        - Backup methods
      parameters:
        - $ref: "#/components/parameters/ComposeAppID"
      requestBody:
        $ref: "#/components/requestBodies/RequestBackup"
      responses:
        "200":
          $ref: "#/components/responses/ResponseOK"
        "400":
          $ref: "#/components/responses/ResponseBadRequest"
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /backup/system:
    post:
      summary: Back this box up
      description: |
        Not the apps: the box itself. Its users, its shares and their accounts,
        its schedules, the destinations it sends backups to -- `/etc/casaos`,
        `/etc/samba/smb.casa.conf`, `/var/lib/casaos/db`, `/var/lib/casaos/conf`
        and rclone's configuration -- filed at the destination under the name
        `casaos-system`, which the destination listing shows and a restore of that
        name puts back. The services holding those files are stopped for the copy
        by default, since sqlite files copied under a running writer are the same
        bad backup a database in a container would be, and started again after.

        Returns as soon as the copy has started; the outcome is written to the run
        log under `casaos-system`.
      operationId: backupSystem
      tags:
        - Backup methods
      requestBody:
        $ref: "#/components/requestBodies/RequestSystemBackup"
      responses:
        "200":
          $ref: "#/components/responses/ResponseOK"
        "400":
          $ref: "#/components/responses/ResponseBadRequest"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /backup/restore:
    post:
      summary: Put an app back from a backup
      description: |
        Returns as soon as the restore has started; it takes as long as it takes,
        and the outcome is written to the run log, marked as a restore.

        The app is stopped for the length of the copy and started again afterwards.
        Its data folders and volumes are made to hold what the backup holds -- files
        added since the backup was taken are removed, since a restore means "as it
        was". Where things go is worked out from the app as it is installed now,
        never from the paths the backup's manifest carries: a manifest is a file on
        a remote that anyone with the credentials can edit. What the backup holds
        and the app no longer declares is reported in the run, not written anywhere.

        An app that is not installed is installed first, from the compose file (and
        `.env`, when there was one) the backup holds; for an installed app the
        compose file it runs now is kept and only its data is restored.
      operationId: restoreBackup
      tags:
        - Backup methods
      requestBody:
        $ref: "#/components/requestBodies/RequestRestore"
      responses:
        "200":
          $ref: "#/components/responses/ResponseOK"
        "400":
          $ref: "#/components/responses/ResponseBadRequest"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /compose/{id}/containers/stats:
    get:
      summary: Sample the CPU and memory usage of an app's containers
      description: |
        One entry per RUNNING container. A container that is not running uses
        nothing, and the daemon has no sample to give for it.

        CPU usage cannot be read from a single sample -- it is a counter that only
        goes up, so one reading says how much CPU the container has used since it
        started, not how much it is using now. Two frames are taken off the
        daemon's stream per container, which is why this call takes about a second
        whatever the size of the app.
      operationId: composeAppContainerStats
      tags:
        - Compose methods
      parameters:
        - $ref: "#/components/parameters/ComposeAppID"
      responses:
        "200":
          $ref: "#/components/responses/ComposeAppContainerStatsOK"
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /compose/{id}/containers/{containerId}/status:
    put:
      summary: Start, stop or restart one container of a compose app
      description: |
        Acts on a single container rather than on the whole app, which is what a
        multi-service stack usually needs: restarting the one service that wedged,
        without taking its siblings down with it.

        The container must belong to the app named in the path. One that does not
        is a 404 rather than an action on somebody else's container.
      operationId: setComposeAppContainerStatus
      tags:
        - Compose methods
      parameters:
        - $ref: "#/components/parameters/ComposeAppID"
        - $ref: "#/components/parameters/ComposeContainerID"
      requestBody:
        $ref: "#/components/requestBodies/RequestContainerStatus"
      responses:
        "200":
          $ref: "#/components/responses/ResponseOK"
        "400":
          $ref: "#/components/responses/ResponseBadRequest"
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /compose/{id}/logs:
    get:
      summary: Get the logs of a compose app
      description: |
        TODO - add description
      operationId: composeAppLogs
      tags:
        - Compose methods
      parameters:
        - $ref: "#/components/parameters/ComposeAppID"
        - name: lines
          in: query
          description: |
            Number of lines to show from the end of the logs for each compose app.

            - show all logs if `-1`
          schema:
            type: integer
            default: 1000
        - name: service
          in: query
          description: |
            Name of the compose service to show the logs of.

            - show the logs of every service if omitted
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/ComposeAppLogsOK"
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /compose/{id}/healthcheck:
    get:
      summary: Check if the compose app is running healthy
      description: |
        By default this method simply check if the `port_map` of the compose app returns `200 OK` status code.

        Custom health check procedure will be implemented in the future.
      operationId: checkComposeAppHealthByID
      tags:
        - Compose methods
      parameters:
        - $ref: "#/components/parameters/ComposeAppID"
      responses:
        "200":
          $ref: "#/components/responses/ComposeAppHealthCheckOK"
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "503":
          $ref: "#/components/responses/ResponseServiceUnavailable"

  /container/{id}:
    patch:
      summary: Recreate the container app
      description: |
        TODO - add description
      operationId: recreateContainerByID
      tags:
        - Container methods
      parameters:
        - $ref: "#/components/parameters/ContainerID"
        - $ref: "#/components/parameters/PullLatestImage"
        - $ref: "#/components/parameters/Force"
      responses:
        "200":
          $ref: "#/components/responses/ContainerRecreateOK"
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"
    delete:
      summary: Remove a container, and optionally some of its named volumes
      description: |
        The container goes; a volume goes only if it is named in `volumes` AND the
        daemon says nothing else uses it. A volume another container still uses is
        refused, and so is one this container does not mount — the list is decided
        again here rather than trusted, because the screen that produced it may
        have been overtaken.

        A container belonging to a compose project is refused outright: removing one
        service through this door leaves the project in a state its own manager does
        not expect.
      operationId: deleteContainer
      tags:
        - Container methods
      parameters:
        - $ref: "#/components/parameters/ContainerID"
      requestBody:
        $ref: "#/components/requestBodies/RequestContainerRemoval"
      responses:
        "200":
          $ref: "#/components/responses/ContainerRemovedOK"
        "400":
          $ref: "#/components/responses/ResponseBadRequest"
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /container/{id}/detail:
    get:
      summary: Everything known about one container
      description: |
        For a container CasaOS did not install, where the name Docker invented says
        nothing and the dashboard had no way to answer "what is this".

        Named volumes come back with their size and how many containers use them,
        which is what a deletion needs before it offers anything.
      operationId: containerDetail
      tags:
        - Container methods
      parameters:
        - $ref: "#/components/parameters/ContainerID"
      responses:
        "200":
          $ref: "#/components/responses/ContainerDetailOK"
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /container/{id}/healthcheck:
    get:
      deprecated: true
      summary: Check if the container app is running healthy
      description: |
        By default this method simply check if the WebUI port of the app returns `200 OK` status code.

        Custom health check procedure will be implemented in the future.

        > This method works for legacy apps running on CasaOS v0.4.3 and earlier.
        > For compose app, use `GET /compose/{id}/healthcheck` instead.
      operationId: checkContainerHealthByID
      tags:
        - Container methods
      parameters:
        - $ref: "#/components/parameters/ContainerID"
      responses:
        "200":
          $ref: "#/components/responses/ContainerHealthCheckOK"
        "503":
          $ref: "#/components/responses/ResponseServiceUnavailable"

  /image:
    post:
      summary: Post a batch pull request specified images
      description: |
        Post a request to pull one or more images asynchronously

        - by `container_ids` - pull images with the specific container IDs
        - by `names` - pull images with the specific image names (not implemented yet)
      operationId: pullImages
      tags:
        - Image methods
      parameters:
        - $ref: "#/components/parameters/ContainerIDs"
      responses:
        "200":
          $ref: "#/components/responses/PullImagesOK"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /images/dangling:
    get:
      summary: Report the disk dangling images are holding
      description: |
        Dangling images are the layers no tag points at any more -- what a rebuild or a
        pulled update leaves behind. This answers "how much would a prune free", so the
        dashboard can name the figure before asking, and is read-only.

        `size` counts each image's *unique* bytes: a dangling image is usually the
        previous build of one still in use and shares most of its layers with it, and
        deleting it does not give those back.
      operationId: danglingImages
      tags:
        - Image methods
      responses:
        "200":
          $ref: "#/components/responses/DanglingImagesOK"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

    delete:
      summary: Delete dangling images
      description: |
        Deletes the images no tag points at, and returns what the daemon actually freed
        -- which can be less than the `get` estimated, if something started using a
        layer in between.

        Only ever dangling images. A stopped app on this box is a normal state, not
        garbage, and a wider prune would delete its image and leave it unable to start
        again without a re-pull; the restriction is in the path so no parameter can
        widen it.
      operationId: pruneDanglingImages
      tags:
        - Image methods
      responses:
        "200":
          $ref: "#/components/responses/DanglingImagesOK"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /web/appgrid:
    get:
      summary: (internal use ONLY)
      operationId: getAppGrid
      tags:
        - Internal methods
      responses:
        "200":
          $ref: "#/components/responses/GetWebAppGridOK"

  /git:
    post:
      summary: Register an app deployed from its git repository
      description: |
        Registers the app; nothing is cloned until `POST /git/{app}/check`. With `access: key` a
        deploy key is generated and its public half returned, to be added to the repository as a
        read-only key. With `access: token` the token is kept on this machine and never returned.

        With `follow` `tags` the app follows the highest version tag of its repository instead of
        a branch: `branch` is then refused, and `tag_pattern` and `prereleases` choose the tags.

        400 for a name that is not a compose project name, a URL CasaOS cannot clone (HTTPS, SSH
        or file, without a password), an access the URL cannot carry, a `follow` other than
        `branch` or `tags`, or a tag pattern that is not one. 409 for a name used by an app, a
        compose project or another git app.
      operationId: createGitApp
      tags:
        - Git methods
      requestBody:
        $ref: "#/components/requestBodies/RequestGitAppCreate"
      responses:
        "200":
          $ref: "#/components/responses/GitAppOK"
        "400":
          $ref: "#/components/responses/ResponseBadRequest"
        "409":
          $ref: "#/components/responses/ResponseConflict"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /git/{app}:
    get:
      summary: A git app, or a compose app whose folder is a git work tree
      description: |
        The state, the public key, and once cloned the compose summary and the `.env` template.
        A compose app whose folder is the top of a git work tree answers with `origin: adoptable`;
        the first `PUT`, `check` or `deploy` adopts it. 404 for any other app.
      operationId: getGitApp
      tags:
        - Git methods
      parameters:
        - $ref: "#/components/parameters/GitAppName"
      responses:
        "200":
          $ref: "#/components/responses/GitAppOK"
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

    put:
      summary: Change the branch, the automatic rebuild, the access, the webhook or the mode of a git app
      description: |
        Every field is optional. The branch changes until the app is cloned. Turning
        `auto_deploy` on clears `auto_paused`. A token is accepted and never returned; an empty
        one is refused, and switching `access` to `none` or `key` forgets the one kept. Adopts an
        adoptable app: 400 when its folder is in detached HEAD or has no remote.

        `webhook_enabled` turns the webhook on, generating its secret when there is none, or
        off, forgetting the secret. `regenerate_webhook_secret` replaces the secret at once, the
        old one refused from then on; 400 while the webhook is off.

        `follow` changes the mode. The folder of a cloned app is put on the branch (`branch`,
        or the remote's default when absent) or detached at its commit, its files untouched;
        `tag_pattern` and `prereleases` are kept either way. A change forgets the last check:
        `check` is null until the next one. After a change, nothing deploys automatically until
        one deployment by hand in the new mode. 400 for a `branch` while the app follows tags,
        when the remote's default branch cannot be read (with the access the request gives),
        and when the folder's own copy of the branch holds commits that neither the folder nor
        the remote's branch has, or that the remote cannot be read to rule out; the
        app, its access included, is then left as it was.
      operationId: updateGitApp
      tags:
        - Git methods
      parameters:
        - $ref: "#/components/parameters/GitAppName"
      requestBody:
        $ref: "#/components/requestBodies/RequestGitAppUpdate"
      responses:
        "200":
          $ref: "#/components/responses/GitAppOK"
        "400":
          $ref: "#/components/responses/ResponseBadRequest"
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "409":
          $ref: "#/components/responses/ResponseConflict"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

    delete:
      summary: Remove a git app no deployment has succeeded for
      description: |
        Allowed while `deployed` is null, whatever the history: the containers, networks and
        images a failed first deployment left, the clone of a created app, the state and the
        secrets go. 409 once a deployment has succeeded (uninstall the app instead) or while an
        operation runs.
      operationId: deleteGitApp
      tags:
        - Git methods
      parameters:
        - $ref: "#/components/parameters/GitAppName"
      responses:
        "200":
          $ref: "#/components/responses/ResponseOK"
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "409":
          $ref: "#/components/responses/ResponseConflict"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /git/{app}/check:
    post:
      summary: Check the repository now
      description: |
        Starts a check in the background and answers 202 with `operation.kind` `check`; poll
        `GET /git/{app}` until `operation` is null. The check asks the remote where the branch
        is, or for an app that follows tags which is the highest eligible tag (`check.error`
        names the filter when none is); for a registered app not cloned yet it clones it, at
        that tag for an app that follows tags, and validates its compose files. A
        clone without a compose file is removed, `check.error` says so and `compose_example`
        holds a compose file to add. When the automatic rebuild may act on a new commit, its
        deployment starts once the check has ended, except while an operating system upgrade of
        the box is open: the check reads, the deployment waits for the first check after the
        upgrade is closed. Adopts an adoptable app: 400 when its folder is in detached HEAD or
        has no remote.
      operationId: checkGitApp
      tags:
        - Git methods
      parameters:
        - $ref: "#/components/parameters/GitAppName"
      responses:
        "202":
          $ref: "#/components/responses/GitAppOK"
        "400":
          $ref: "#/components/responses/ResponseBadRequest"
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "409":
          $ref: "#/components/responses/ResponseConflict"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /git/{app}/deploy:
    post:
      summary: Deploy a git app
      description: |
        Starts the deployment in the background and answers 202 with the operation running. No
        commit: the remote's latest. A commit of the history: a revert, which pauses the
        automatic rebuild. For an app that follows tags, `tag` deploys any eligible tag, lower
        ones included (only a tag lower than the deployed one, a revert included, pauses the
        automatic deployment; the same or a higher one resumes it); neither `tag` nor `commit`
        deploys the highest eligible tag; a commit must be a version of the history. `tag` with
        `commit`: 400. `env` is written as `.env` first, while no deployment has succeeded
        and never when the repository tracks `.env`. 400 when a precondition fails, the message
        saying which: the folder not on its branch, tracked files modified, the commit already
        deployed, a revert to a version whose images are gone or over commits made in the folder.
        Adopts an adoptable app.
      operationId: deployGitApp
      tags:
        - Git methods
      parameters:
        - $ref: "#/components/parameters/GitAppName"
      requestBody:
        $ref: "#/components/requestBodies/RequestGitAppDeploy"
      responses:
        "202":
          $ref: "#/components/responses/GitAppOK"
        "400":
          $ref: "#/components/responses/ResponseBadRequest"
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "409":
          $ref: "#/components/responses/ResponseConflict"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /git/{app}/tags:
    get:
      summary: The tags an app that follows tags may deploy
      description: |
        Asks the remote, as a check does. The eligible tags: those matching `tag_pattern` when
        there is one, strict semver after one leading `v`, pre-releases only with
        `prereleases`. Highest first, equal versions by name, at most 50. 400 for an app that
        follows a branch, or a repository that cannot be reached.
      operationId: getGitAppTags
      tags:
        - Git methods
      parameters:
        - $ref: "#/components/parameters/GitAppName"
      responses:
        "200":
          $ref: "#/components/responses/GitAppTagsOK"
        "400":
          $ref: "#/components/responses/ResponseBadRequest"
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /git/{app}/webhook:
    post:
      summary: A forge tells that the repository changed
      description: |
        Called by the forge, not the dashboard: no token, but the body signed with the app's
        webhook secret. `X-Hub-Signature-256: sha256=<hex>`, `X-Gitea-Signature`,
        `X-Forgejo-Signature` and `X-Gogs-Signature` carry the hex HMAC-SHA256 of the raw body,
        `X-Gitlab-Token` the secret itself; at least one is sent and every one sent is valid, or
        401. The body, read up to 5 MiB (413 beyond), is signed and never interpreted, so this
        route is not checked against this spec: forges send form-encoded bodies too.

        A push (`X-GitHub-Event`, `X-Gitea-Event`, `X-Forgejo-Event` or `X-Gogs-Event` `push`;
        `X-Gitlab-Event` `Push Hook` or `Tag Push Hook`), or a signed delivery naming no event,
        starts what `POST /git/{app}/check` starts and answers 202 `checking`; a push less than
        10 seconds after the last check a webhook started, or while one is queued, answers 202
        `coalesced`; a push to an app another operation holds queues one check that runs once
        the app is free, waiting up to 30 minutes, and answers 202 `queued`. GitHub's `ping`
        answers 200 `pong`; any other event 202 `ignored`. While an operating system upgrade of
        the box is open a push starts no check and answers 202 `held`: the app is checked, and
        its new commit deployed when the automatic rebuild may, by the first check after the
        upgrade is closed. 404 alike for an app that does not exist and a webhook that is off.
      operationId: receiveGitWebhook
      security: []
      tags:
        - Git methods
      parameters:
        - $ref: "#/components/parameters/GitAppName"
      responses:
        "200":
          $ref: "#/components/responses/ResponseOK"
        "202":
          $ref: "#/components/responses/ResponseOK"
        "401":
          description: No valid signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
              example:
                message: invalid signature
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "413":
          description: A body over 5 MiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
              example:
                message: the body is over 5 MiB
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  # the endpoint is newer version of POST /appstore for the demand of @ETWang1991
  # the old api is dependent by CasaOS. So we can't remove it.
  # a good idea is /v3/app-management/appstore. But it is hard to implement in ZimaOS
  # So I had to add the endpoint here.
  /web/sync/appstore:
    post:
      summary: Register an app store in Sync.
      description: |
        (TODO)
      operationId: registerAppStoreSync
      tags:
        - AppStore methods
      parameters:
        - $ref: "#/components/parameters/AppStoreURL"
      responses:
        "200":
          $ref: "#/components/responses/AppStoreRegisterOK"
        "400":
          $ref: "#/components/responses/ResponseBadRequest"
        "409":
          $ref: "#/components/responses/ResponseConflict"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

  /stats:
    get:
      summary: List the containers and their latest resource use
      description: |
        Every container Docker knows, and those whose history is still within seven
        days (state `stopped`, no numbers). The body is bare: no `data` envelope.

        `cpu_percent` is a percentage of one core (200 is two cores), `null` until two
        samples exist; `memory_limit` is `null` when the container declares no limit.
        `notes` carries codes the page translates (`stats_capacity`: some containers
        are listed but not measured).

        Docker down gives 503 `stats_unavailable` on this route only: the history
        routes keep answering from disk.
      operationId: statsList
      tags:
        - Stats methods
      responses:
        "200":
          $ref: "#/components/responses/StatsListOK"
        "503":
          $ref: "#/components/responses/ResponseServiceUnavailable"

  /stats/{id}:
    get:
      summary: The resource history of one container
      description: |
        Series over `range` (`live` when absent). The body is bare: no `data` envelope.

        Each point is `[t, avg, min, max]`, t in Unix seconds; `null` values are a gap
        (nothing was measured), never a zero. `scale.cpu` is `percent_of_one_core`;
        `scale.cpu_allocation` is the container's CPU limit in cores, or the machine's
        cores with the note `no_cpu_limit`; `scale.memory_limit` is the declared limit
        in bytes, or `null` with the note `no_memory_limit`.

        Errors: 400 `bad_range`, 404 `unknown_item`, 503 `stats_unavailable` (the
        sampler is not running or the history is unreadable). Docker being down is
        not an error here: the outage is a gap.
      operationId: statsSeries
      tags:
        - Stats methods
      parameters:
        - $ref: "#/components/parameters/StatsItemID"
        - $ref: "#/components/parameters/StatsRange"
      responses:
        "200":
          $ref: "#/components/responses/StatsSeriesOK"
        "400":
          $ref: "#/components/responses/ResponseBadRequest"
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "503":
          $ref: "#/components/responses/ResponseServiceUnavailable"

  /stats/{id}/alerts:
    get:
      summary: The alert rules of one container and its firing alerts
      description: |
        The body is bare: no `data` envelope. Errors: 404 `unknown_item`,
        503 `stats_unavailable`.
      operationId: statsAlerts
      tags:
        - Stats methods
      parameters:
        - $ref: "#/components/parameters/StatsItemID"
      responses:
        "200":
          $ref: "#/components/responses/StatsAlertsOK"
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "503":
          $ref: "#/components/responses/ResponseServiceUnavailable"

    put:
      summary: Update the alert rules sent for one container
      description: |
        Answers like the GET. Each rule carries its four properties; the rules not
        sent keep their current values. A bad rule is 400 with `message` naming the
        field, `bad_rules: rules[0].threshold` (also for a property of the wrong type
        or missing); a body that is not JSON, not an object, has no `rules` list or
        is over 64 KiB is `bad_rules: rules`. The handler checks the body itself:
        the request validator skips this route. Errors: 404 `unknown_item` (also for
        a listed container with no history yet: its rules would not be kept),
        503 `stats_unavailable` (also when the rules were applied in memory but
        could not be written to disk: they are not durable).
      operationId: setStatsAlerts
      tags:
        - Stats methods
      parameters:
        - $ref: "#/components/parameters/StatsItemID"
      requestBody:
        $ref: "#/components/requestBodies/RequestStatsRules"
      responses:
        "200":
          $ref: "#/components/responses/StatsAlertsOK"
        "400":
          $ref: "#/components/responses/ResponseBadRequest"
        "404":
          $ref: "#/components/responses/ResponseNotFound"
        "503":
          $ref: "#/components/responses/ResponseServiceUnavailable"

  /logs/apps:
    get:
      summary: The apps and services that have logs
      description: |
        Every app with a log on disk, its title and icon when it is installed, and per
        service the current container, whether it is followed now, the first and last
        line's time and the bytes kept. `_other` holds the containers of no app.
        Errors: 503 while the logs store is not open.
      operationId: logsApps
      tags:
        - Logs methods
      responses:
        "200":
          $ref: "#/components/responses/LogsAppsOK"
        "503":
          $ref: "#/components/responses/ResponseServiceUnavailable"

  /logs:
    get:
      summary: One page of log lines, with the events of the same window
      description: |
        Newest first from `until` (or now), older pages with `before`; oldest first with
        `since`. `next` is the cursor of the page's last line, empty when nothing is left.
        `events` are the matching apps' events between the page's two ends.
        Errors: 400 on a bad cursor, a bad regex, or `since` with `before`; 503 while
        the logs store is not open.
      operationId: logsQuery
      tags:
        - Logs methods
      parameters:
        - $ref: "#/components/parameters/LogsFilterApp"
        - $ref: "#/components/parameters/LogsFilterService"
        - $ref: "#/components/parameters/LogsFilterStream"
        - $ref: "#/components/parameters/LogsFilterLevel"
        - $ref: "#/components/parameters/LogsFilterQ"
        - $ref: "#/components/parameters/LogsFilterRegex"
        - $ref: "#/components/parameters/LogsSince"
        - $ref: "#/components/parameters/LogsUntil"
        - $ref: "#/components/parameters/LogsBefore"
        - $ref: "#/components/parameters/LogsLimit"
      responses:
        "200":
          $ref: "#/components/responses/LogsPageOK"
        "400":
          $ref: "#/components/responses/ResponseBadRequest"
        "503":
          $ref: "#/components/responses/ResponseServiceUnavailable"

  /logs/stream:
    get:
      summary: The new lines and events, live (WebSocket)
      description: |
        A WebSocket: each message is one JSON object `{t, line?, event?, dropped?}`,
        `t` being `line`, `event` or `lag` (`dropped` messages were lost because the
        client read too slowly). The server pings every 30 s. A browser cannot send a
        header on a WebSocket: the JWT goes in `token`, which no other route accepts.
        Errors: 400 on a bad filter, 503 while the logs store is not open.
      operationId: logsStream
      tags:
        - Logs methods
      parameters:
        - $ref: "#/components/parameters/LogsFilterApp"
        - $ref: "#/components/parameters/LogsFilterService"
        - $ref: "#/components/parameters/LogsFilterStream"
        - $ref: "#/components/parameters/LogsFilterLevel"
        - $ref: "#/components/parameters/LogsFilterQ"
        - $ref: "#/components/parameters/LogsFilterRegex"
        - $ref: "#/components/parameters/LogsToken"
      responses:
        "101":
          description: Switching Protocols to a WebSocket
        "400":
          $ref: "#/components/responses/ResponseBadRequest"
        "503":
          $ref: "#/components/responses/ResponseServiceUnavailable"

  /logs/events:
    get:
      summary: The apps' events, newest first
      description: |
        Errors: 503 while the logs store is not open.
      operationId: logsEvents
      tags:
        - Logs methods
      parameters:
        - $ref: "#/components/parameters/LogsFilterApp"
        - $ref: "#/components/parameters/LogsEventKind"
        - $ref: "#/components/parameters/LogsEventSince"
        - $ref: "#/components/parameters/LogsUntil"
        - $ref: "#/components/parameters/LogsLimit"
      responses:
        "200":
          $ref: "#/components/responses/LogsEventsOK"
        "503":
          $ref: "#/components/responses/ResponseServiceUnavailable"

  /logs/export:
    get:
      summary: Download the matching lines as text, oldest first
      description: |
        One line per log line, as kept on disk (`<time> <o|e> <text>`), prefixed with
        `[app/service] ` when several services are exported. Events are not exported.
        Errors: 400 on a bad cursor or a bad regex, 503 while the logs store is not open.
      operationId: logsExport
      tags:
        - Logs methods
      parameters:
        - $ref: "#/components/parameters/LogsFilterApp"
        - $ref: "#/components/parameters/LogsFilterService"
        - $ref: "#/components/parameters/LogsFilterStream"
        - $ref: "#/components/parameters/LogsFilterLevel"
        - $ref: "#/components/parameters/LogsFilterQ"
        - $ref: "#/components/parameters/LogsFilterRegex"
        - $ref: "#/components/parameters/LogsSince"
        - $ref: "#/components/parameters/LogsUntil"
      responses:
        "200":
          $ref: "#/components/responses/LogsExportOK"
        "400":
          $ref: "#/components/responses/ResponseBadRequest"
        "503":
          $ref: "#/components/responses/ResponseServiceUnavailable"

  /logs/settings:
    get:
      summary: The logs' retention, size cap and where they are kept
      operationId: getLogsSettings
      tags:
        - Logs methods
      responses:
        "200":
          $ref: "#/components/responses/LogsSettingsOK"

    put:
      summary: Change the logs' retention and size cap
      description: |
        Saved at once, then the old logs are purged. Errors: 400 on a value out of range.
      operationId: setLogsSettings
      tags:
        - Logs methods
      requestBody:
        $ref: "#/components/requestBodies/RequestLogsSettings"
      responses:
        "200":
          $ref: "#/components/responses/LogsSettingsOK"
        "400":
          $ref: "#/components/responses/ResponseBadRequest"
        "500":
          $ref: "#/components/responses/ResponseInternalServerError"

components:
  securitySchemes:
    access_token:
      type: apiKey
      in: header
      name: Authorization

  parameters:
    GlobalSettingKey:
      name: key
      description: Key of the global setting
      in: path
      required: true
      schema:
        type: string
        example: "OPENAI_API_KEY"

    AppStoreURL:
      name: url
      description: URL of the app store
      in: query
      schema:
        type: string
        example: "https://github.com/IceWhaleTech/CasaOS-AppStore"

    AppStoreID:
      name: id
      description: ID of the app store
      in: path
      required: true
      schema:
        type: integer
        example: 0

    StoreAppIDString:
      name: id
      description: Store app ID of a compose app (unique across all app stores)
      in: path
      required: true
      schema:
        type: string
        example: "syncthing"
    
    StoreAppCategoryFilter:
      name: category
      description: Category of the store app
      in: query
      schema:
        type: string
        example: "chat"

    StoreAppAuthorTypeFilter:
      name: author_type
      description: Author type of the store app
      in: query
      schema:
        $ref: "#/components/schemas/StoreAppAuthorType"

    StoreAppRecommendedFilter:
      name: recommend
      description: The store app is recommended
      in: query
      schema:
        type: boolean
        default: false

    ComposeAppID:
      name: id
      description: App ID of a compose app (equivalent to compose project name)
      in: path
      required: true
      schema:
        type: string
        example: "syncthing"

    BackupDestinationName:
      name: name
      description: Name of a backup destination
      in: path
      required: true
      schema:
        type: string

    BackupApp:
      name: app
      description: The app a backup is of
      in: path
      required: true
      schema:
        type: string

    BackupStamp:
      name: stamp
      description: Which run, as the run log names it
      in: path
      required: true
      schema:
        type: string
        example: "offsite"

    GitAppName:
      name: app
      description: Name of a git app, which is its compose project name
      in: path
      required: true
      schema:
        type: string
        example: jarvis

    ComposeContainerID:
      name: containerId
      description: ID of a container belonging to the compose app
      in: path
      required: true
      schema:
        type: string
        example: "3f1c9a2b4d5e"

    ContainerIDs:
      name: container_ids
      description: a list of comma separated container IDs
      in: query
      schema:
        type: string
        example: "e4380876-d759-4b26-af1f-968a4606d399"

    ContainerID:
      name: id
      description: Container ID in the Docker runtime
      in: path
      required: true
      schema:
        type: string
      example: 09e70f4a7dd3fc43de6a1bc40d45c79f857544e13679e5b1a47409034a7ce621

    DeleteConfigFolder:
      name: delete_config_folder
      description: Delete the config folder of the app, and with it its named Docker volumes. Left false, both stay, and the next install of the app finds its data.
      in: query
      schema:
        type: boolean
        default: true

    PullLatestImage:
      name: pull
      description: Try to pull the latest image from the registry
      in: query
      schema:
        type: boolean
        default: false

    Force:
      name: force
      in: query
      schema:
        type: boolean
        default: false

    DryRun:
      name: dry_run
      description: |
        Dry run the request without actually excuting it, useful for validation and testing.

        - `true` - validate only
        - `false` - validate and execute the request
      in: query
      schema:
        type: boolean
        default: false

    CheckPortConflict:
      name: check_port_conflict
      description: |
        Check if the port of the app conflicts with ports already in use.

        - `true` - check port conflict
        - `false` - skip port conflict check
      in: query
      schema:
        type: boolean
        default: true

    Uncontrolled:
      name: uncontrolled
      description: |
        Install the app without any control. the control mean version control, if the app is stable and latest. it is controlled, It will auto update. otherwise it is uncontrolled.

        - `true` - uncontrolled install
        - `false` - normal install
      in: query
      schema:
        type: boolean
        example: false

    StatsItemID:
      name: id
      description: |
        A container's stats identity, encoded for a URL as one path segment:
        `app:<application>:<service>:<n>` or `container:<name>`.
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        example: "app:jarvis:web:1"

    StatsRange:
      name: range
      description: |
        One of `live` (15 minutes at 5 s, the default when absent), `15m`, `1h`, `24h`,
        `7d`. Any other value is 400 `bad_range`.
      in: query
      schema:
        type: string
        example: "1h"

    LogsFilterApp:
      name: app
      description: Only these apps (repeat the parameter for several); all when absent.
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string

    LogsFilterService:
      name: service
      description: Only these services (repeat the parameter for several); all when absent.
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string

    LogsFilterStream:
      name: stream
      description: "`o` stdout only, `e` stderr only."
      in: query
      schema:
        type: string
        enum: ["o", "e"]

    LogsFilterLevel:
      name: level
      description: The minimum level, guessed from each line's text and stream.
      in: query
      schema:
        type: string
        enum: ["info", "warn", "error"]

    LogsFilterQ:
      name: q
      description: Text the line contains, case-insensitive; a regular expression with `regex`.
      in: query
      schema:
        type: string

    LogsFilterRegex:
      name: regex
      in: query
      schema:
        type: boolean

    LogsSince:
      name: since
      description: A line's cursor; the lines after it, oldest first.
      in: query
      schema:
        type: string

    LogsUntil:
      name: until
      in: query
      schema:
        type: string
        format: date-time

    LogsBefore:
      name: before
      description: A line's cursor (a page's `next`); the lines before it, newest first.
      in: query
      schema:
        type: string

    LogsLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 500

    LogsToken:
      name: token
      description: The JWT, for a browser's WebSocket, which cannot send a header.
      in: query
      schema:
        type: string

    LogsEventKind:
      name: kind
      description: Only these kinds (repeat the parameter for several); all when absent.
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string

    LogsEventSince:
      name: since
      in: query
      schema:
        type: string
        format: date-time

  requestBodies:
    RequestGitAppCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GitAppCreateRequest"

    RequestGitAppUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GitAppUpdateRequest"

    RequestGitAppDeploy:
      required: false
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GitAppDeployRequest"

    RequestComposeAppUpdates:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ComposeAppUpdateRequest"

    RequestComposeApp:
      description: Compose app YAML content
      required: true
      content:
        application/yaml:
          schema:
            $ref: "#/components/schemas/ComposeApp"
          example: |
            # docker compose YAML content
            services:
              ...
        application/json:
          schema:
            $ref: "#/components/schemas/ComposeApp"

    RequestBackupSchedules:
      description: Every standing arrangement, replacing what was there
      required: true
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/BackupSchedule"

    RequestContainerRemoval:
      description: Which of the container's named volumes to remove with it
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              volumes:
                type: array
                items:
                  type: string

    RequestBackupDestination:
      description: An rclone backend and its own options
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BackupDestinationSpec"

    RequestBackupSignIn:
      description: The cloud drive to sign in to
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BackupSignInSpec"

    RequestBackupSignInFinish:
      description: The address of the page the provider redirected to
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BackupSignInFinishSpec"

    RequestBackupDestinationRestic:
      description: The password of a repository that is already there; empty for a new one
      required: false
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BackupDestinationResticSpec"

    RequestBackup:
      description: Where to put this backup, and whether to stop the app first
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BackupRequest"

    RequestSystemBackup:
      description: Where to put a backup of the box itself, and whether to stop its services first
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SystemBackupRequest"

    RequestRestore:
      description: Which backup to put back, and of which app
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RestoreRequest"

    RequestContainerStatus:
      description: What to do to a single container
      required: true
      content:
        application/json:
          schema:
            type: string
            enum:
              - "start"
              - "restart"
              - "stop"

    RequestComposeAppStatus:
      description: Compose app status
      required: true
      content:
        application/json:
          schema:
            type: string
            enum:
              - "start"
              - "restart"
              - "stop"

    RequestStatsRules:
      description: The whole set of rules of one container
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              rules:
                type: array
                items:
                  $ref: "#/components/schemas/StatsRule"

    RequestLogsSettings:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LogsSettingsInput"


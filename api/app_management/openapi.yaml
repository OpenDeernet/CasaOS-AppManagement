    ContainerDetail:
      description: What one container is, for somebody who did not create it.
      properties:
        id:
          type: string
        name:
          type: string
        image:
          type: string
        state:
          type: string
        status:
          type: string
          description: Docker's own line, "Up 3 hours" or "Exited (0) 2 days ago".
        created:
          type: integer
          format: int64
        command:
          type: string
        restart_policy:
          type: string
        compose_project:
          type: string
          description: |-
            Set when the container belongs to a compose project. Removal is refused
            for those: taking one service out leaves the project in a state its own
            manager does not expect.
        networks:
          type: array
          items:
            type: string
        ports:
          type: array
          items:
            $ref: "#/components/schemas/ContainerPortMapping"
        volumes:
          type: array
          description: Named volumes, with what a deletion needs to know about each.
          items:
            $ref: "#/components/schemas/ContainerVolume"
        binds:
          type: array
          description: Host paths the container mounts directly.
          items:
            $ref: "#/components/schemas/ContainerBind"
        env:
          type: array
          description: |-
            Environment, as Docker holds it. These often carry credentials; they are
            shown because rebuilding a container without them is not possible, and
            the compose editor already shows the same for installed apps.
          items:
            type: string

    ContainerPortMapping:
      properties:
        host:
          type: string
        container:
          type: string
        protocol:
          type: string

    ContainerVolume:
      properties:
        name:
          type: string
        target:
          type: string
        size:
          type: integer
          format: int64
          description: Bytes, or -1 when the driver cannot measure it.
        containers:
          type: integer
          format: int64
          description: How many containers use it, this one included, or -1 when unknown.
        removable:
          type: boolean
        reason:
          type: string
          description: Why it may not be removed, when it may not.

    ContainerBind:
      properties:
        source:
          type: string
        target:
          type: string
        read_only:
          type: boolean

    BackupSchedule:
      required:
        - app
        - destination
        - every
        - at
      properties:
        app:
          type: string
          example: "nextcloud"
        destination:
          type: string
          example: "offsite"
        every:
          type: string
          enum: ["daily", "weekly"]
        at:
          type: string
          description: Local time of day, HH:MM. Local because somebody chose it looking at their own clock.
          example: "03:00"
        weekday:
          type: integer
          description: 0 is Sunday. Weekly only.
          example: 1
        keep:
          type: integer
          description: |-
            How many runs survive at the destination. Zero keeps everything, which
            is the safe reading of a field nobody filled in.
          example: 7
        hold_still:
          type: boolean
        enabled:
          type: boolean
        last_run:
          type: string
          format: date-time
          readOnly: true
        last_slot:
          type: string
          format: date-time
          readOnly: true
          description: The most recent slot of the schedule, with the box's UTC offset. Absent when disabled or unreadable.
        next_slot:
          type: string
          format: date-time
          readOnly: true
          description: The slot after that one, with the box's UTC offset. Absent when disabled or unreadable.

    BackupVerificationRequest:
      type: object
      required: [destination, app, stamp]
      properties:
        destination:
          type: string
          minLength: 1
          maxLength: 128
        app:
          type: string
          minLength: 1
          maxLength: 128
        stamp:
          type: string
          minLength: 1
          maxLength: 128

    BackupVerificationRecord:
      type: object
      required: [id, destination, app, stamp, status, started_at, checked_operations, skipped_count, files, bytes]
      properties:
        id:
          type: string
        destination:
          type: string
        app:
          type: string
        stamp:
          type: string
        status:
          type: string
          description: |-
            One of running, passed, failed, cancelled, interrupted, not_verifiable.
            Cancelled and interrupted are not a result, neither a pass nor a failure.
            Not verifiable means the backup is bigger than the limits.
            Kept as a string to preserve existing generated enum names.
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        checked_operations:
          type: integer
          minimum: 0
        skipped_count:
          type: integer
          minimum: 0
        files:
          type: integer
          format: int64
          minimum: 0
        bytes:
          type: integer
          format: int64
          minimum: 0
        error:
          type: string
          description: A safe failure explanation, never transport credentials.

    BackupVerificationSchedule:
      type: object
      required: [enabled, every_days, at]
      properties:
        enabled:
          type: boolean
          default: false
        every_days:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
        at:
          type: string
          description: Local time of day, HH:MM.
          example: "03:00"
        last_run:
          type: string
          format: date-time
          readOnly: true

    BackupForceTarget:
      type: object
      required: [app, destination]
      properties:
        app:
          type: string
        destination:
          type: string

    BackupForceRefusal:
      type: object
      required: [app, destination, reason]
      properties:
        app:
          type: string
        destination:
          type: string
        reason:
          type: string

    BackupForceResult:
      type: object
      required: [started, refused]
      properties:
        started:
          type: array
          items:
            $ref: "#/components/schemas/BackupForceTarget"
        refused:
          type: array
          items:
            $ref: "#/components/schemas/BackupForceRefusal"

    BackupRunRecord:
      properties:
        app:
          type: string
        destination:
          type: string
        stamp:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        scheduled:
          type: boolean
        containers_stopped:
          type: boolean
        restore:
          type: boolean
          description: True for a run that put the app back from a backup rather than one that took a backup.
        copied:
          type: integer
        skipped_count:
          type: integer
        bytes:
          type: integer
          format: int64
          description: The size of what was read for the copy, measured on the box. 0 for a restore.
        error:
          type: string
          description: Empty when the run succeeded.

    BackupDestinationSpec:
      required:
        - backend
      properties:
        backend:
          type: string
          description: An rclone backend name, passed through untouched.
          example: "s3"
        encrypt:
          type: boolean
          description: |-
            Encrypt names and contents before they leave this box, with rclone's
            crypt backend on top of the one named. A bucket at a provider then holds
            ciphertext it cannot read. The password is kept by rclone, obscured, and
            cannot be read back; losing it loses every backup at this destination.
        password:
          type: string
          description: The encryption password. Required with `encrypt`; never returned.
        root:
          type: string
          description: |-
            Where on the backend everything is put, handed to rclone as it is: a folder,
            or for an object store (s3) the bucket. Without it an object store gets one
            bucket per app, named after the app, which a provider where bucket names are
            shared by everyone will refuse. A destination made without it keeps working
            as it did.
          example: "my-box-backups"
        parameters:
          type: object
          additionalProperties:
            type: string
          description: |-
            That backend's own options. Not interpreted here: rclone knows what each
            backend needs, and a list of required fields kept on this side would be
            wrong the first time rclone gained an option.
          example:
            provider: "Wasabi"
            access_key_id: "..."

    BackupSignInSpec:
      required:
        - backend
      properties:
        backend:
          type: string
          description: An rclone backend that signs in through a browser.
          enum: [drive, dropbox, onedrive]
          example: "drive"

    BackupSignInLink:
      properties:
        url:
          type: string
          description: The provider's sign-in address, to open in a browser.

    BackupSignInFinishSpec:
      required:
        - redirected
      properties:
        redirected:
          type: string
          description: |-
            The address of the page the provider redirected to, which does not load
            (`http://127.0.0.1:53682/?state=...&code=...`). Only its query is used.

    BackupSignInToken:
      properties:
        token:
          type: string
          description: The token to put in the destination's `token` option.
        parameters:
          type: object
          additionalProperties:
            type: string
          description: |-
            The other options the backend needs, found out once signed in: OneDrive's
            `drive_id` and `drive_type`. Absent for the other backends.

    BackupDestinationSpace:
      properties:
        used:
          type: integer
          format: int64
        free:
          type: integer
          format: int64
        total:
          type: integer
          format: int64

    BackupDestinationRestic:
      required:
        - available
        - enabled
        - kept
      properties:
        available:
          type: boolean
        enabled:
          type: boolean
        kept:
          type: boolean
        last_check:
          $ref: "#/components/schemas/BackupDestinationResticCheck"

    BackupDestinationResticCheck:
      description: How the last check of a restic repository went.
      required:
        - at
        - ok
      properties:
        at:
          type: string
          format: date-time
        ok:
          type: boolean
        error:
          type: string
          description: What restic said, when the repository did not check out.

    BackupDestinationResticSpec:
      properties:
        password:
          type: string
          description: Opens the repository already at this destination. Leave out for a new one.

    BackupDestinationResticPassword:
      required:
        - password
      properties:
        password:
          type: string
          description: Opens the repository.

    BackupHeldApp:
      description: One app a destination holds backups of.
      required:
        - app
        - installed
        - stamps
      properties:
        app:
          type: string
        installed:
          type: boolean
          description: Whether this box runs the app now. A restore of one it does not installs it first, from the backup.
        stamps:
          type: array
          description: Its runs, newest first, as the run log names them.
          items:
            type: string

    SystemBackupRequest:
      required:
        - destination
      properties:
        destination:
          type: string
          example: "offsite"
        hold_still:
          type: boolean
          default: true
          description: Stop the services that hold the box's files open for the length of the copy.

    BackupFile:
      description: One file or folder inside a backup.
      required:
        - name
        - directory
        - size
      properties:
        name:
          type: string
        directory:
          type: boolean
        size:
          type: integer
          format: int64
          description: In bytes; zero for a folder.
        modified:
          type: string
          format: date-time

    RestoreRequest:
      required:
        - destination
        - app
        - stamp
      properties:
        destination:
          type: string
          example: "offsite"
        app:
          type: string
          description: The app to put back, which must be the app the backup is of.
          example: "nextcloud"
        stamp:
          type: string
          description: Which backup, as the run log names it.
          example: "2026-09-13T02-29-56Z"
        paths:
          type: array
          description: |
            Put back only these paths of the backup, as browsing it names them, instead
            of all of it. They go to the places the app has now, over what is there,
            and nothing else is deleted -- unlike a whole restore, which makes the
            folders hold what the backup holds. The app must be installed, and is
            stopped for the copy as for a whole restore.
          items:
            type: string
          example: ["volumes/data/docs/report.odt"]

    BackupRequest:
      required:
        - destination
      properties:
        destination:
          type: string
          example: "offsite"
        hold_still:
          type: boolean
          default: true
          description: |-
            Stop the app's containers for the length of the copy. Leaving it running
            takes a copy that may not restore.
        keep:
          type: integer
          minimum: 1
          example: 3
          description: |-
            Once this backup has landed, keep only the last `keep` backups of this
            app at this destination, this one included, and delete the rest. Absent
            keeps everything. A schedule's retention is its own and separate.

    ContainerStats:
      description: What one container is using, sampled just now.
      required:
        - container_id
        - service
        - cpu_percent
        - memory_used
        - memory_limit
      properties:
        container_id:
          type: string
          example: "3f1c9a2b4d5e"
        service:
          type: string
          example: "jellyfin"
        cpu_percent:
          type: number
          format: double
          description: |-
            Percent of ONE CPU, as `docker stats` reports it: a container using all
            of two cores reads 200, not 100.
          example: 12.5
        memory_used:
          type: integer
          format: int64
          description: Bytes held, with the page cache subtracted.
          example: 268435456
        memory_limit:
          type: integer
          format: int64
          description: |-
            Bytes the container may use. The host's whole memory when the container
            declares no limit of its own.
          example: 8589934592

    ComposeAppContainers:
      description: |-
        Schema for `ComposeAppContainersOK` response.
      properties:
        main:
          type: string
          example: "syncthing"
        containers:
          type: object
          description: |-
            The key is the name of a docker compose `service`, and the value is the list of
            every container currently belonging to that service.

            A service can hold more than one container (see
            https://docs.docker.com/compose/compose-file/deploy/#replicas), and a service
            declared in the compose file can hold none at all when the app is down, so the
            list can be empty.
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/ContainerSummary"
          example:
            syncthing:
              - {}

    ContainerSummary:
      type: object
      description: |-
        See [Go Doc](https://pkg.go.dev/github.com/docker/compose/v5@v5.5.1/pkg/api#ContainerSummary) for the schema structure of `ContainerSummary`.

      x-go-type: api.ContainerSummary
      x-go-type-import:
        name: api
        path: github.com/docker/compose/v5/pkg/api

    EnvStoreInfo:
      required:
        - container
        - description
      properties:
        container:
          type: string
          example: TZ
        description:
          type: object
          additionalProperties:
            type: string
          example:
            en_us: Time Zone

    PortStoreInfo:
      required:
        - container
        - description
      properties:
        container:
          type: string
          example: 8384
        description:
          type: object
          additionalProperties:
            type: string
          example:
            en_us: Web UI

    PortList:
      type: array
      readOnly: true
      items:
        type: string
        example: "8384"

    VolumeStoreInfo:
      required:
        - container
        - description
      properties:
        container:
          type: string
          example: /config
        description:
          type: object
          additionalProperties:
            type: string
          example:
            en_us: Syncthing config directory

    DeviceStoreInfo:
      properties:
        container:
          type: string
          example: /dev/dri
        description:
          type: object
          additionalProperties:
            type: string
          example:
            en_us: GPU device

    TipsStoreInfo:
      required:
        - before_install
      properties:
        before_install:
          type: object
          additionalProperties:
            type: string
          example:
            en_us: |
              Tips for users before install.
          x-oapi-codegen-extra-tags:
            mapstructure: "before_install"
            yaml: "before_install,omitempty"
        custom:
          type: string
          example: "custom tips by user"
    Scheme:
      type: string
      default: http
      enum:
        - http
        - https
      x-oapi-codegen-extra-tags:
        yaml: ",omitempty"

    StoreAppID:
      title: Store app ID
      description: |
        Store app ID of the compose app (unique across all app stores)

        > The `store_app_id` might be same as app name most of the time. However app name might change, due to cloning for example.
        > If app name has changed, there is no way to associate it with the original app in the app store, unless we use the `store_app_id`.
      readOnly: true
      type: string
      example: "syncthing"
      x-go-name: StoreAppID
      x-oapi-codegen-extra-tags:
        mapstructure: "store_app_id"
        yaml: "store_app_id,omitempty"

    StoreAppAuthorType:
      title: Store app author type
      description: |
        Type of the author of the app

        - `official`: The app is contributed by the app owner, i.e. `author`` and `developer`` are the same.
        - `by_casaos`: The app is contributed by CasaOS team, i.e. `author` is `CasaOS Team`
        - `community`: The app is contributed by the community, i.e. any app that is not `official` or `by_casaos`
      readOnly: true
      type: string
      enum:
        - official
        - by_casaos
        - community
        - unknown
      x-enum-varnames:
        - AuthorTypeOfficial
        - AuthorTypeByCasaOS
        - AuthorTypeCommunity
        - AuthorTypeUnknown

    DanglingImages:
      description: |
        Images no tag points at any more -- either what a prune would free, or what one
        just freed.
      required:
        - count
        - size
      properties:
        count:
          description: How many dangling images.
          type: integer
          example: 7
        size:
          description: |
            Bytes. Unique bytes only, so this is what the disk would actually give back
            rather than the sum of the images' full sizes.
          type: integer
          format: int64
          example: 4509715660

    ComposeAppUpdatePlan:
      description: What updating every app at once would do.
      required:
        - apps
      properties:
        apps:
          type: array
          items:
            $ref: "#/components/schemas/ComposeAppUpdatePlanApp"

    ComposeAppUpdatePlanApp:
      required:
        - id
        - title
        - icon
        - kind
        - services
      properties:
        id:
          type: string
          example: jellyfin
        title:
          type: string
          example: Jellyfin
        icon:
          type: string
          example: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Jellyfin/icon.png
        kind:
          description: |
            `catalogue` when the catalogue moves at least one image, which is then
            listed with the image it moves to; `image` when the images stay named
            as they are and the last image check found a newer build under one of
            them, in which case every service is listed as it is.
          type: string
          enum:
            - catalogue
            - image
        services:
          type: array
          items:
            $ref: "#/components/schemas/ComposeAppUpdatePlanService"

    ComposeAppUpdatePlanService:
      required:
        - name
        - from
        - to
      properties:
        name:
          type: string
          example: jellyfin
        from:
          type: string
          example: jellyfin/jellyfin:10.9.11
        to:
          type: string
          example: jellyfin/jellyfin:10.10.3

    ComposeAppUpdateRequest:
      required:
        - ids
      properties:
        ids:
          description: The apps to update, in this order.
          type: array
          items:
            type: string
          example:
            - jellyfin
            - syncthing

    ComposeAppUpdateRun:
      description: An update of every app, in progress or done.
      required:
        - started_at
        - apps
      properties:
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        apps:
          type: array
          items:
            $ref: "#/components/schemas/ComposeAppUpdateRunApp"

    ComposeAppUpdateRunApp:
      required:
        - id
        - state
      properties:
        id:
          type: string
          example: jellyfin
        state:
          type: string
          enum:
            - queued
            - updating
            - updated
            - current
            - failed
        message:
          description: The reason, when the app stayed current for one, or the error.
          type: string

    ImageUpdateCheckResult:
      description: What one check pass found.
      required:
        - updatable
        - unchecked
      properties:
        updatable:
          description: Apps whose registry holds a different image than the copy on disk.
          type: array
          items:
            type: string
          example:
            - syncthing
        unchecked:
          description: |
            Apps no answer could be obtained for, and why. A registry that cannot be
            reached is not evidence that nothing changed, so these keep the answer they
            had rather than being reported as up to date.
          type: object
          additionalProperties:
            type: string
          example:
            plex: image never pulled on this host
    GitAccess:
      description: |
        How the repository is reached: `none` for a public one, `key` for a deploy key CasaOS
        generates (SSH URLs), `token` for a personal access token (HTTPS URLs).

        One of `none`, `key`, `token`. Not declared as an enum, for the reason given on
        `GitAppState`.
      type: string
      example: key

    GitFollow:
      description: |
        What the app deploys: `branch`, the head of its branch; `tags`, the highest version tag
        eligible under `tag_pattern` and `prereleases`, and automatically only a higher one.

        One of `branch`, `tags`. Not declared as an enum, for the reason given on
        `GitAppState`.
      type: string
      example: tags

    GitApp:
      description: |
        An app deployed from its git repository (`created` or `adopted`), or a compose app
        whose folder is a git work tree and that can be adopted (`adoptable`).
      required:
        - app
        - origin
        - dir
        - remote
        - branch
        - follow
        - tag_pattern
        - prereleases
        - access
        - token_set
        - auto_deploy
        - auto_paused
        - blocked
        - env_tracked
        - cloned
        - head
        - deployed
        - check
        - new_commits
        - state
        - operation
        - history
        - compose
        - compose_example
        - env_template
        - build_log
        - webhook
      properties:
        app:
          type: string
          example: jarvis
        origin:
          type: string
          description: One of `created`, `adopted`, `adoptable`.
          example: created
        dir:
          type: string
          example: /DATA/AppData/jarvis
        remote:
          type: string
          description: Empty for a folder with no remote, which cannot be adopted.
          example: git@github.com:owner/jarvis.git
        branch:
          type: string
          description: |
            Empty for a folder in detached HEAD, which cannot be adopted, and for an app that
            follows tags.
          example: main
        follow:
          $ref: "#/components/schemas/GitFollow"
        tag_pattern:
          type: string
          description: |
            A glob on the full tag name (`*`, `?`, `[...]`), empty for every version tag. Kept
            while the app follows a branch.
          example: v2.*
        prereleases:
          type: boolean
          description: Whether pre-releases (`-rc`, `-beta`, ...) are eligible. Kept while the app follows a branch.
        access:
          $ref: "#/components/schemas/GitAccess"
        public_key:
          type: string
          description: The deploy key to add to the repository, read-only. Only with `access` `key`.
          example: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI... casaos-jarvis
        token_set:
          type: boolean
          description: Whether a token is kept. The token itself is never returned.
        auto_deploy:
          type: boolean
        auto_paused:
          type: boolean
          description: Set by a manual revert (for an app that follows tags, by a manual deployment of a tag lower than the deployed one); cleared by turning `auto_deploy` on again or by another manual deployment.
        blocked:
          type: boolean
          description: A rollback failed; nothing automatic runs until a manual deployment or revert.
        env_tracked:
          type: boolean
          description: The repository tracks `.env`, which CasaOS then never writes.
        cloned:
          type: boolean
        head:
          $ref: "#/components/schemas/GitAppHead"
        deployed:
          $ref: "#/components/schemas/GitAppDeployed"
        check:
          $ref: "#/components/schemas/GitAppCheck"
        new_commits:
          type: boolean
          description: |
            False while `deployed` is null. For an app that follows tags, true only for a tag
            higher than `deployed.tag`, or any other commit while `deployed.tag` is empty.
        state:
          $ref: "#/components/schemas/GitAppState"
        operation:
          $ref: "#/components/schemas/GitAppOperation"
        history:
          type: array
          description: The last three deployments, newest first.
          items:
            $ref: "#/components/schemas/GitAppHistoryEntry"
        compose:
          $ref: "#/components/schemas/GitAppCompose"
        compose_example:
          type: string
          nullable: true
          description: |
            A compose file to add at the root of the repository, when the last check cloned a
            repository without one (the clone is removed and `check.error` says so). Null otherwise.
        env_template:
          type: string
          nullable: true
          description: The repository's `.env.example` or `.env.sample`.
        build_log:
          type: string
          description: The last 64 KiB of the last build's log.
        webhook:
          $ref: "#/components/schemas/GitWebhook"

    GitWebhook:
      description: |
        The app's webhook: a push the forge POSTs to `path`, signed with `secret`, checks the
        app at once. The secret is not in backups: a restored app comes back with its webhook off.
      required:
        - enabled
        - path
        - last_delivery
      properties:
        enabled:
          type: boolean
        path:
          type: string
          description: The route to give the forge, after the address it reaches the box by.
          example: /v2/app_management/git/jarvis/webhook
        secret:
          type: string
          description: 64 hex characters, only while `enabled`.
          example: 5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e
        last_delivery:
          $ref: "#/components/schemas/GitWebhookDelivery"

    GitWebhookDelivery:
      description: The last delivery whose signature was valid. Null until the first one.
      nullable: true
      required:
        - at
        - forge
        - event
        - result
      properties:
        at:
          type: string
          format: date-time
        forge:
          type: string
          description: |
            One of `github`, `gitea`, `forgejo`, `gogs`, `gitlab`, `unknown`: named after the
            event header, else after the signature header. Not declared as an enum, for the
            reason given on `GitAppState`.
          example: github
        event:
          type: string
          description: The event header's value, at most 64 characters; empty when the forge sent none.
          example: push
        result:
          type: string
          description: |
            One of `checked`, `coalesced`, `queued`, `held`, `ignored`, `pong`. Not declared as an
            enum, for the reason given on `GitAppState`.
          example: checked

    GitAppHead:
      description: The commit the folder is on. Null until cloned.
      nullable: true
      required:
        - commit
        - subject
        - tracked_files_clean
      properties:
        commit:
          type: string
        subject:
          type: string
        tracked_files_clean:
          type: boolean

    GitAppDeployed:
      description: The version running. Null before the first successful deployment.
      nullable: true
      required:
        - commit
        - subject
        - at
        - tag
      properties:
        commit:
          type: string
        subject:
          type: string
        at:
          type: string
          format: date-time
        tag:
          type: string
          description: The tag the commit was deployed as; empty for a branch's commit.
          example: v1.4.2

    GitAppCheck:
      description: The last check of the remote. Null before the first check.
      nullable: true
      required:
        - at
        - remote_commit
        - remote_tag
        - tag_moved
        - error
      properties:
        at:
          type: string
          format: date-time
        remote_commit:
          type: string
        remote_tag:
          type: string
          description: The highest eligible tag, which names `remote_commit`; empty for an app that follows a branch.
          example: v1.4.2
        tag_moved:
          type: boolean
          description: |
            `remote_tag` is `deployed.tag` on another commit than `deployed.commit`. Never
            redeployed automatically; deploying that tag by hand builds its new commit.
        error:
          type: string

    GitAppOperation:
      description: The operation running. Null when none runs.
      nullable: true
      required:
        - kind
        - commit
        - started_at
        - tag
      properties:
        kind:
          type: string
          description: One of `check`, `build`, `deploy`, `revert`.
          example: build
        commit:
          type: string
        started_at:
          type: string
          format: date-time
        tag:
          type: string
          description: The tag `commit` is deployed as; empty for a branch's commit.

    GitAppHistoryEntry:
      required:
        - commit
        - subject
        - at
        - outcome
        - reason
        - revertable
        - tag
      properties:
        commit:
          type: string
        subject:
          type: string
        at:
          type: string
          format: date-time
        outcome:
          type: string
          description: One of `adopted`, `deployed`, `build_failed`, `rolled_back`, `failed`, `interrupted`.
          example: deployed
        reason:
          type: string
        revertable:
          type: boolean
          description: Whether this version can be reverted to, its images and its commit still being there.
        tag:
          type: string
          description: The tag the commit was deployed as; empty for a branch's commit.

    GitAppCompose:
      description: What the repository's compose files will run. Null until cloned.
      nullable: true
      required:
        - files
        - services
      properties:
        files:
          type: array
          items:
            type: string
          example:
            - compose.yaml
        services:
          type: array
          items:
            $ref: "#/components/schemas/GitAppComposeService"

    GitAppComposeService:
      required:
        - name
        - build
        - image
        - ports
        - volumes
        - sensitive
      properties:
        name:
          type: string
          example: web
        build:
          type: boolean
          description: Built from the repository rather than pulled.
        image:
          type: string
        ports:
          type: array
          description: As written in the compose file.
          items:
            type: string
          example:
            - "8080:8080"
        volumes:
          type: array
          description: As written in the compose file.
          items:
            type: string
          example:
            - ./data:/data
        sensitive:
          type: array
          description: |
            Options that give the service power over the host, only these values: `privileged`,
            `network_mode_host`, `pid_host`, `cap_add`, `devices`, `docker_socket` (a bind of the
            Docker socket).
          items:
            type: string
          example:
            - privileged

    GitAppCreateRequest:
      required:
        - name
        - url
        - access
      properties:
        name:
          type: string
          description: A compose project name, which also names the folder under /DATA/AppData.
          example: jarvis
        url:
          type: string
          example: git@github.com:owner/jarvis.git
        branch:
          type: string
          description: Empty or absent for the branch the remote's HEAD points to; refused with `follow` `tags`.
          example: main
        access:
          $ref: "#/components/schemas/GitAccess"
        token:
          type: string
          description: Required with `access` `token`; never returned.
        follow:
          $ref: "#/components/schemas/GitFollow"
        tag_pattern:
          type: string
          description: At most 100 characters, no space; a `path.Match` glob such as `v2.*`.
        prereleases:
          type: boolean

    GitAppUpdateRequest:
      properties:
        branch:
          type: string
        auto_deploy:
          type: boolean
        access:
          $ref: "#/components/schemas/GitAccess"
        token:
          type: string
          description: Never returned; an empty token is refused.
        webhook_enabled:
          type: boolean
          description: On generates the secret when there is none; off forgets it.
        regenerate_webhook_secret:
          type: boolean
          description: Replaces the secret at once; 400 while the webhook is off.
        follow:
          $ref: "#/components/schemas/GitFollow"
        tag_pattern:
          type: string
          description: At most 100 characters, no space; a `path.Match` glob such as `v2.*`.
        prereleases:
          type: boolean

    GitAppDeployRequest:
      properties:
        commit:
          type: string
          description: |
            Absent for the remote's latest commit (the highest eligible tag for an app that
            follows tags); a commit of the history reverts to it.
          pattern: "^[0-9a-f]{40}$"
        tag:
          type: string
          description: |
            For an app that follows tags, instead of `commit` (both: 400): an eligible tag,
            lower ones included.
          example: v1.4.2
        env:
          type: string
          description: The `.env` to write, accepted while no deployment has succeeded and never when the repository tracks `.env`.

    GitTag:
      required:
        - name
        - commit
      properties:
        name:
          type: string
          example: v1.4.2
        commit:
          type: string
          description: The commit the tag names, an annotated tag peeled.

    GitAppState:
      description: |
        `building` and `deploying` while a deployment runs. Otherwise `failed` when automatic
        actions are blocked or the last deployment failed; `build_failed`, `rolled_back` or
        `interrupted` when that is how the last deployment ended; `unreachable` when the last
        check could not reach the repository; `idle` otherwise.

        One of `idle`, `building`, `deploying`, `build_failed`, `rolled_back`, `failed`,
        `unreachable`, `interrupted`. Not declared as an enum: oapi-codegen v1.12.4 renames the
        constants of existing enums when one is added.
      type: string
      example: idle

    GitAppGrid:
      description: |
        What the app card shows of a git app. A git app with no container, never deployed or
        left without one by a failed first deployment, is in the grid all the same, with an
        empty `status`.
      required:
        - new_commits
        - state
        - deployed
      properties:
        new_commits:
          type: boolean
        state:
          $ref: "#/components/schemas/GitAppState"
        deployed:
          type: boolean
          description: False until a deployment has succeeded.

    WebAppGridItem:
      description: (internal use ONLY)
      required:
        - app_type
      properties:
        git:
          $ref: "#/components/schemas/GitAppGrid"
        update_available:
          description: |
            Whether something newer than what this app runs is available.

            Read from the cache a check pass fills, never computed here: the grid is on
            the dashboard's first paint and must not wait on a registry. Absent means
            this app has not been checked since the service started.
          type: boolean
          example: true
        store_app_id:
          $ref: "#/components/schemas/StoreAppID"
        scheme:
          $ref: "#/components/schemas/Scheme"
        status:
          type: string
          example: running
        name:
          type: string
        title:
          type: object
          additionalProperties:
            type: string
            example:
              en_us: Syncthing
        icon:
          type: string
          example: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Syncthing/icon.png
        author_type:
          $ref: "#/components/schemas/StoreAppAuthorType"
        app_type:
          type: string
          enum:
            - v2app
            - v1app
            - container
            - link
        created:
          type: integer
          format: int64
          description: |-
            When the container was made, in seconds since the epoch. The one fact that
            separates a container somebody started last week from one left behind two
            years ago, and the dashboard had no way to tell them apart.
          example: 1757548800

        compose_project:
          description: |
            Name of the compose project this container belongs to, absent when it belongs to none.

            Only ever set on an `app_type: container` item. Such an item is not proof that
            no stack owns the container: a project whose config file cannot be loaded is
            missing from the compose list, and its containers are reported one by one like
            any adopted container. This is what the container itself says
            (`com.docker.compose.project`).
          type: string
          example: immich
        compose_load_error:
          description: |
            Why the compose project named in `compose_project` is missing from the compose list,
            absent when the container belongs to no project or its project loaded. These are the
            loader's own words, which name the file and the field, so the owner knows what to change.
          type: string
          example: "open /data/compose/1/docker-compose.yml: no such file or directory"
        hostname:
          type: string
          example: ""
        port:
          type: string
          example: 3000
        index:
          type: string
          example: index
        image:
          type: string
          example: gitea/gitea:1
        is_uncontrolled:
          type: boolean
          example: false

    StatsItem:
      type: object
      required:
        - id
        - name
        - kind
        - group
        - state
        - started_at
        - detail
        - cpu_percent
        - memory_used
        - memory_limit
        - alerts
      properties:
        id:
          type: string
          example: "app:jarvis:web:1"
        name:
          type: string
          example: web
        kind:
          description: "`app-container` or `container`"
          type: string
        group:
          type: string
          example: Conteneurs
        app:
          description: The application of a compose container, absent for any other
          type: string
          example: jarvis
        state:
          description: "`running`, `stopped`, `paused`, `crashed` or `unknown`"
          type: string
        started_at:
          description: When the container started, `null` when unknown
          type: string
          format: date-time
          nullable: true
        detail:
          description: The container's image, text only, `null` when unknown
          type: string
          maxLength: 200
          nullable: true
          example: "nginx:1.27"
        cpu_percent:
          description: Percent of one core, `null` before two samples
          type: number
          format: double
          nullable: true
        memory_used:
          description: Working set in bytes
          type: integer
          format: int64
          nullable: true
        memory_limit:
          description: Declared limit in bytes, `null` without one
          type: integer
          format: int64
          nullable: true
        alerts:
          description: Number of firing alerts
          type: integer

    StatsList:
      type: object
      required:
        - items
        - notes
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StatsItem"
        notes:
          type: array
          items:
            type: string
          example: []

    StatsScale:
      type: object
      required:
        - cpu
        - cpu_allocation
        - memory_limit
      properties:
        cpu:
          type: string
          example: percent_of_one_core
        cpu_allocation:
          description: Cores the container may use
          type: number
          format: double
          nullable: true
        memory_limit:
          description: Declared limit in bytes, `null` without one
          type: integer
          format: int64
          nullable: true

    StatsSeriesChart:
      type: object
      required:
        - chart
        - name
        - unit
        - points
      properties:
        chart:
          type: string
          example: cpu
        name:
          type: string
          example: user
        unit:
          type: string
          example: percent
        points:
          description: "`[t, avg, min, max]`, t in Unix seconds; `null` is a gap"
          type: array
          items:
            type: array
            items:
              type: number
              format: double
              nullable: true

    StatsSeries:
      type: object
      required:
        - id
        - range
        - step_seconds
        - from
        - to
        - scale
        - series
        - notes
      properties:
        id:
          type: string
          example: "app:jarvis:web:1"
        range:
          type: string
          example: "1h"
        step_seconds:
          type: integer
          example: 60
        from:
          type: integer
          format: int64
        to:
          type: integer
          format: int64
        scale:
          $ref: "#/components/schemas/StatsScale"
        series:
          type: array
          items:
            $ref: "#/components/schemas/StatsSeriesChart"
        notes:
          type: array
          items:
            type: string
          example: ["no_cpu_limit"]

    StatsRule:
      type: object
      properties:
        key:
          type: string
          example: cpu_high
        enabled:
          type: boolean
        threshold:
          description: Percent
          type: number
          format: double
          example: 90
        minutes:
          type: integer
          example: 10

    StatsAlert:
      type: object
      required:
        - key
        - since
        - value
      properties:
        key:
          type: string
          example: cpu_high
        since:
          type: string
          format: date-time
        value:
          type: number
          format: double

    StatsAlerts:
      type: object
      required:
        - rules
        - active
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/StatsRule"
        active:
          type: array
          items:
            $ref: "#/components/schemas/StatsAlert"

    LogLine:
      type: object
      required: [at, app, service, container, stream, text]
      properties:
        at:
          type: string
          format: date-time
        app:
          type: string
        service:
          type: string
        container:
          description: The container id's first 12 characters.
          type: string
        stream:
          description: "`o` stdout, `e` stderr."
          type: string
        text:
          type: string
        cursor:
          description: Where the line is, to pass as `since` or `before`. In history pages only, never on the stream.
          type: string

    LogEvent:
      type: object
      required: [at, app, service, container, kind, by]
      properties:
        at:
          type: string
          format: date-time
        app:
          type: string
        service:
          type: string
        container:
          type: string
        kind:
          description: |
            `created`, `started`, `stopped`, `died`, `oom-killed`, `restarting`, `unhealthy`,
            `healthy`, `installed`, `uninstalled`, `updated` or `image-pulled`.
          type: string
        exit_code:
          type: string
        from_image:
          type: string
        to_image:
          type: string
        by:
          description: "`operation` (done through ReCasaOS) or `docker`."
          type: string
        detail:
          type: string

    LogsPage:
      type: object
      required: [lines, events, next]
      properties:
        lines:
          type: array
          items:
            $ref: "#/components/schemas/LogLine"
        events:
          type: array
          items:
            $ref: "#/components/schemas/LogEvent"
        next:
          description: The cursor of the next page, empty when nothing is left.
          type: string

    LogsService:
      type: object
      required: [service, container, running, first_at, last_at, size_bytes]
      properties:
        service:
          type: string
        container:
          type: string
        running:
          description: The container is followed now.
          type: boolean
        first_at:
          type: string
          format: date-time
        last_at:
          type: string
          format: date-time
        size_bytes:
          type: integer
          format: int64

    LogsApp:
      type: object
      required: [app, title, icon, uninstalled, services]
      properties:
        app:
          type: string
        title:
          description: The app's title by language, null when it is not installed.
          type: object
          nullable: true
          additionalProperties:
            type: string
        icon:
          type: string
          nullable: true
        uninstalled:
          type: boolean
        services:
          type: array
          items:
            $ref: "#/components/schemas/LogsService"

    LogsSettingsInput:
      type: object
      required: [retention_days, max_size_mb, include_others]
      properties:
        retention_days:
          type: integer
          minimum: 1
          maximum: 3650
        max_size_mb:
          type: integer
          minimum: 64
          maximum: 1048576
        include_others:
          description: Also keep the logs of the containers of no app.
          type: boolean

    LogsSettings:
      type: object
      required: [retention_days, max_size_mb, include_others, used_mb, oldest_at, path]
      properties:
        retention_days:
          type: integer
        max_size_mb:
          type: integer
        include_others:
          type: boolean
        used_mb:
          type: number
          format: double
        oldest_at:
          type: string
          format: date-time
          nullable: true
        path:
          type: string

        app:
          type: string
          example: jarvis
        kind:
          type: string
          description: |
            What runs on the app, as a busy app's 409 names it: `backup`, `restore`, `install`,
            `update`, `deploy`, `check` and so on. An app held while a backup or restore also
            runs on it is listed under what holds it. Not declared as an enum, for the reason
            given on `GitAppState`.
          example: backup

    GlobalSetting:
      required:
        - key
        - value

  schemas:
    LiveBackup:
      required: [id, app, destination, stamp, origin, started_at, operation, operations, source]
      properties:
        id:
          type: string
          example: b7
        app:
          type: string
          example: happy_rik
        destination:
          type: string
          example: GDrive
        stamp:
          type: string
          example: 2026-11-08T16-55-18Z
        origin:
          description: Why it runs, `scheduled`, `forced` or `on_demand`. Not an enum, as `AppOperation.kind`.
          type: string
        started_at:
          type: string
          format: date-time
        operation:
          description: The operation under way, counted from 1.
          type: integer
        operations:
          type: integer
        source:
          type: string
          example: /DATA/AppData/overseerr/config
        stats:
          $ref: "#/components/schemas/LiveBackupStats"

    LiveBackupStats:
      description: The engine's counters for the operation under way. A total left out is still being taken stock of.
      required: [bytes, files, updated_at]
      properties:
        bytes:
          type: integer
          format: int64
        total_bytes:
          type: integer
          format: int64
        files:
          type: integer
          format: int64
        total_files:
          type: integer
          format: int64
        speed:
          description: Bytes a second.
          type: integer
          format: int64
        eta:
          description: Seconds left.
          type: integer
          format: int64
        current:
          type: string
        updated_at:
          type: string
          format: date-time

    BackupPass:
      required: [origin, started_at, items]
      properties:
        origin:
          description: "`scheduled` or `forced`."
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/BackupPassItem"

    BackupPassItem:
      required: [app, destination, state]
      properties:
        app:
          type: string
        destination:
          type: string
        state:
          description: "`waiting`, `running`, `done`, `failed`, `stopped`, or `held` while an operating system upgrade is open."
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        bytes:
          type: integer
          format: int64
        error:
          type: string

    BaseResponse:
      properties:
        message:
          description: message returned by server side if there is any
